# Schemathesis configuration for ControlHub OpenAPI fuzz testing.
# Provides valid path parameter values for operations that require existing resources.
# The disposable Testcontainers DB starts fresh each run, so resource IDs 1-10 are
# stable after seed migrations (0004, 00009, 00010).

# Warning policy: display accepted warnings but do not fail CI on them.
[warnings]
display = ["missing_auth", "missing_test_data", "validation_mismatch"]
fail-on = []

# Override POST /resources/{id}/relations with valid seed resource IDs.
[[operations]]
include-operation-id = "createResourceRelation"
parameters = { "path.id" = 1, "body.toResourceId" = 2 }

# Override PATCH /resources/{id} to use a known seed resource ID.
[[operations]]
include-operation-id = "patchResource"
parameters = { "path.id" = 1 }
