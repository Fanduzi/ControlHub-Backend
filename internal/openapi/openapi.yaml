openapi: 3.1.0
info:
  title: ControlHub API
  version: 0.1.0
  description: >
    **Security note (Phase 1):** Write endpoints (POST, PATCH, DELETE) do not
    enforce authentication or authorization. Any caller reaching the server can
    create, modify, or delete resources and relations. This is acceptable for
    local development only. An auth middleware gate must be added before any
    network-accessible deployment.
servers:
  - url: http://localhost:8080
paths:
  /auth/login:
    post:
      summary: Login with local credentials
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Login response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        "400":
          description: Invalid request payload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /health:
    get:
      summary: Health check
      operationId: getHealth
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    type: string
                    enum:
                      - ok
  /resources:
    get:
      summary: List resources
      operationId: listResources
      parameters:
        - in: query
          name: resourceType
          schema:
            type: array
            items:
              $ref: "#/components/schemas/ResourceType"
          style: form
          explode: true
          description: >-
            Filter by resource type (repeated for OR: ?resourceType=host&resourceType=database_instance).
            Across filter families = AND.
        - in: query
          name: environmentId
          schema:
            type: array
            items:
              type: integer
              format: int64
          style: form
          explode: true
          description: >-
            Filter by environment ID (repeated for OR). Across filter families = AND.
        - in: query
          name: lifecycleStatus
          schema:
            type: array
            items:
              $ref: "#/components/schemas/LifecycleStatus"
          style: form
          explode: true
          description: >-
            Filter by lifecycle status (repeated for OR). Across filter families = AND.
        - in: query
          name: healthStatus
          schema:
            type: array
            items:
              $ref: "#/components/schemas/HealthStatus"
          style: form
          explode: true
          description: >-
            Filter by health status (repeated for OR). Across filter families = AND.
        - in: query
          name: resourceSubtype
          schema:
            type: array
            items:
              type: string
          style: form
          explode: true
          description: >-
            Filter by resource subtype (repeated for OR: ?resourceSubtype=mysql&resourceSubtype=clickhouse).
            Across filter families = AND.
        - in: query
          name: q
          schema:
            type: string
          description: Free-text search over name, displayName, externalId
        - in: query
          name: page
          schema:
            type: integer
            default: 1
            minimum: 1
          description: Page number
        - in: query
          name: pageSize
          schema:
            type: integer
            default: 20
            minimum: 1
            maximum: 100
          description: Items per page
        - in: query
          name: includeArchived
          schema:
            type: boolean
            default: false
          description: Include archived resources in results (default excludes them)
        - in: query
          name: archivedOnly
          schema:
            type: boolean
            default: false
          description: >-
            Return only archived resources. Takes precedence over includeArchived
            when both are true.
      responses:
        "200":
          description: Resource list with pagination
          content:
            application/json:
              schema:
                type: object
                required: [items, pageInfo]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/Resource"
                  pageInfo:
                    $ref: "#/components/schemas/PageInfo"
              example:
                items:
                  - id: 4000000000000000001
                    resourceType: database_instance
                    resourceSubtype: mysql
                    name: order-mysql-prod
                    displayName: Order MySQL Prod
                    environmentId: 1000000000000000001
                    ownerId: 2000000000000000001
                    lifecycleStatus: running
                    healthStatus: healthy
                    source: manual
                    externalId: ext-order-mysql
                    labels:
                      team: order
                    createdAt: "2026-04-11T20:00:00Z"
                    updatedAt: "2026-04-11T20:00:00Z"
                pageInfo:
                  page: 1
                  pageSize: 20
                  totalItems: 64
                  totalPages: 4
        "400":
          description: Invalid query parameters
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    post:
      summary: Create a resource
      operationId: createResource
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResourceCreateInput"
      responses:
        "201":
          description: Resource created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Resource"
        "400":
          description: Validation failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Referenced environment or owner not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Resource name already exists in environment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /resources/{id}:
    get:
      summary: Get resource detail
      operationId: getResource
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: Resource detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResourceDetailResponse"
        "400":
          description: Invalid resource ID
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Resource not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    patch:
      summary: Update mutable resource fields
      operationId: patchResource
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResourcePatchRequest"
      responses:
        "200":
          description: Resource updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Resource"
        "400":
          description: Validation failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Resource not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Resource is archived and cannot be modified
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /resources/{id}/archive:
    post:
      summary: Archive (soft-delete) a resource
      description: >
        Marks a resource as archived by setting archivedAt. Idempotent —
        archiving an already-archived resource returns it unchanged.
        Archived resources are excluded from default list queries but remain
        readable via GET detail. Archived resources reject PATCH and relation
        creation with 409.
      operationId: archiveResource
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ArchiveRequest"
      responses:
        "200":
          description: Resource archived (or already archived)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Resource"
        "400":
          description: Validation failed (e.g. blank reason)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Resource not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /resources/{id}/unarchive:
    post:
      summary: Restore an archived resource to active visibility
      description: >
        Clears archivedAt, archivedBy, and archiveReason on a resource.
        Idempotent — unarchiving an already-active resource returns it
        unchanged. After unarchiving, the resource reappears in default
        list queries and can be modified via PATCH again.
      operationId: unarchiveResource
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: Resource unarchived (or already active)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Resource"
        "400":
          description: Invalid resource ID
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Resource not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /resources/{id}/profile:
    get:
      summary: Get resource typed profile projection
      description: >
        Read-only projection of the typed profile row for a resource.
        The `profile` object keys vary by `resourceType` and
        `resourceSubtype`.  Values may be string, number, boolean, or null.
        If the resource exists but has no typed profile row, `profile` is
        returned as an empty object `{}`.
      operationId: getResourceProfile
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: Resource profile projection
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResourceProfileResponse"
        "400":
          description: Invalid resource ID
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Resource not found
    put:
      summary: Replace typed profile fields for a resource
      operationId: putResourceProfile
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        "204":
          description: Profile replaced
        "400":
          description: Validation failed or malformed JSON
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Resource not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Archived resource cannot be modified
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    patch:
      summary: Partially update typed profile fields for a resource
      operationId: patchResourceProfile
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        "204":
          description: Profile updated
        "400":
          description: Validation failed or malformed JSON
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Resource not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Archived resource cannot be modified
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      summary: Delete the typed profile row for a resource
      operationId: deleteResourceProfile
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "204":
          description: Profile deleted
        "400":
          description: Invalid resource ID
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Resource not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Archived resource cannot be modified
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /resources/{id}/relations:
    get:
      summary: List relations for a resource
      operationId: listResourceRelations
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: Resource relation list
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/ResourceRelation"
        "400":
          description: Invalid resource ID
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    post:
      summary: Create a relation from this resource to another
      operationId: createResourceRelation
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RelationCreateInput"
      responses:
        "201":
          description: Relation created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResourceRelation"
        "400":
          description: Validation failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Source or target resource not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Duplicate relation already exists, or source/target resource is archived
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /resource-relations/{id}:
    delete:
      summary: Delete a relation
      operationId: deleteResourceRelation
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "204":
          description: Relation deleted
        "400":
          description: Invalid relation ID
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Relation not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /resources/{id}/audit-events:
    get:
      summary: List audit events for a resource
      description: >
        Phase-1 bootstrap endpoint. Backed by a minimal MySQL table for
        local development only; the long-term backing store will be
        ClickHouse.  The response shape will remain stable after migration.
      operationId: listResourceAuditEvents
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: Resource audit list
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/AuditEvent"
        "400":
          description: Invalid resource ID
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /audit-events:
    get:
      summary: List audit events
      description: >
        Phase-1 bootstrap endpoint. Backed by a minimal MySQL table for
        local development only; the long-term backing store will be
        ClickHouse.  The response shape will remain stable after migration.
      operationId: listAuditEvents
      parameters:
        - in: query
          name: targetResourceId
          schema:
            type: integer
            format: int64
          description: Filter by target resource ID
        - in: query
          name: eventType
          schema:
            type: array
            items:
              type: string
          style: form
          explode: true
          description: >-
            Filter by event type (repeated for OR: ?eventType=resource.created&eventType=resource.updated).
            Across filter families = AND.
        - in: query
          name: result
          schema:
            type: array
            items:
              type: string
          style: form
          explode: true
          description: >-
            Filter by result (repeated for OR). Across filter families = AND.
        - in: query
          name: page
          schema:
            type: integer
            default: 1
            minimum: 1
          description: Page number
        - in: query
          name: pageSize
          schema:
            type: integer
            default: 20
            minimum: 1
            maximum: 100
          description: Items per page
      responses:
        "200":
          description: Audit event list with pagination
          content:
            application/json:
              schema:
                type: object
                required: [items, pageInfo]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/AuditEvent"
                  pageInfo:
                    $ref: "#/components/schemas/PageInfo"
              example:
                items:
                  - id: 6000000000000000001
                    actorUserId: 3000000000000000001
                    targetResourceId: 4000000000000000001
                    eventType: resource.updated
                    result: success
                    createdAt: "2026-04-11T21:00:00Z"
                pageInfo:
                  page: 1
                  pageSize: 20
                  totalItems: 25
                  totalPages: 2
        "400":
          description: Invalid query parameters
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /environments:
    get:
      summary: List environments
      operationId: listEnvironments
      responses:
        "200":
          description: Environment list
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/Environment"
  /owners:
    get:
      summary: List owners
      operationId: listOwners
      responses:
        "200":
          description: Owner list
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/Owner"
  /roles:
    get:
      summary: List roles
      operationId: listRoles
      responses:
        "200":
          description: Role list
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/Role"
  /resource-types:
    get:
      summary: List resource types
      operationId: listResourceTypes
      responses:
        "200":
          description: Resource type dictionary
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/DictionaryItem"
  /relation-types:
    get:
      summary: List relation types
      operationId: listRelationTypes
      responses:
        "200":
          description: Relation type dictionary
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/DictionaryItem"
  /lifecycle-statuses:
    get:
      summary: List lifecycle statuses
      operationId: listLifecycleStatuses
      responses:
        "200":
          description: Lifecycle status dictionary
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/DictionaryItem"
  /health-statuses:
    get:
      summary: List health statuses
      operationId: listHealthStatuses
      responses:
        "200":
          description: Health status dictionary
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/DictionaryItem"
  /resource-subtypes:
    get:
      summary: List resource subtypes for a given resource type
      operationId: listResourceSubtypes
      parameters:
        - in: query
          name: resourceType
          required: true
          schema:
            $ref: "#/components/schemas/ResourceType"
          description: The resource type to list subtypes for
      responses:
        "200":
          description: Resource subtypes
          content:
            application/json:
              schema:
                type: object
                required: [resourceType, subtypes]
                properties:
                  resourceType:
                    type: string
                  subtypes:
                    type: array
                    items:
                      $ref: "#/components/schemas/DictionaryItem"
        "400":
          description: Missing or invalid resourceType parameter
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  # ──────────────────────────────────────────────────────────────
  # IMPLEMENTED: Topology read model endpoint
  # ──────────────────────────────────────────────────────────────
  /resources/{id}/topology:
    get:
      summary: Get resource topology
      description: >
        Read-only topology projection around a root resource, built from
        existing resources and relations. Returns nodes, edges, and
        optional groups for graph visualization. Supports depth (1 or 2)
        and directional filtering (upstream, downstream, or both).
      operationId: getResourceTopology
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
            format: int64
          description: Root resource ID
        - in: query
          name: depth
          schema:
            type: integer
            enum: [1, 2]
            default: 1
          description: Traversal depth (1 = direct neighbors, 2 = two hops)
        - in: query
          name: direction
          schema:
            type: string
            enum: [both, upstream, downstream]
            default: both
          description: >
            Expansion direction relative to the root.
            `downstream`: edges where root is fromResourceId.
            `upstream`: edges where root is toResourceId.
            `both`: include both.
        - in: query
          name: relationType
          schema:
            $ref: "#/components/schemas/RelationType"
          description: Optional filter to include only edges of this relation type
      responses:
        "200":
          description: Topology projection
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TopologyResponse"
              example:
                rootResourceId: 4000000000000000001
                depth: 1
                direction: both
                isDatabaseTopology: true
                nodes:
                  - id: 4000000000000000001
                    resourceType: database_cluster
                    resourceSubtype: mysql
                    name: order-mysql-cluster-prod
                    displayName: Order MySQL Cluster Prod
                    environmentId: 1000000000000000001
                    ownerId: 2000000000000000002
                    lifecycleStatus: running
                    healthStatus: healthy
                    isRoot: true
                    distance: 0
                    topologyRole: cluster
                    topologyLayer: cluster
                    visualImportance: 10
                    isDatabaseTopology: true
                  - id: 4000000000000000002
                    resourceType: database_instance
                    resourceSubtype: mysql
                    name: order-mysql-1-prod
                    displayName: Order MySQL 1 Prod
                    environmentId: 1000000000000000001
                    ownerId: 2000000000000000002
                    lifecycleStatus: running
                    healthStatus: healthy
                    isRoot: false
                    distance: 1
                    topologyRole: primary
                    topologyLayer: replication
                    groupKey: "cluster:4000000000000000001"
                    visualImportance: 9
                    isDatabaseTopology: true
                    replicationDepth: 0
                edges:
                  - id: 5000000000000000001
                    fromResourceId: 4000000000000000002
                    toResourceId: 4000000000000000001
                    relationType: member_of
                    semanticType: membership
                groups:
                  - id: 1
                    label: Database Cluster
                    resourceType: database_cluster
                    nodeIds:
                      - 4000000000000000001
                  - id: 2
                    label: Database Instance
                    resourceType: database_instance
                    nodeIds:
                      - 4000000000000000002
        "400":
          description: Invalid query parameters
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Root resource not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
components:
  schemas:
    PageInfo:
      type: object
      required: [page, pageSize, totalItems, totalPages]
      properties:
        page:
          type: integer
          description: Current page number (1-based)
        pageSize:
          type: integer
          description: Number of items per page
        totalItems:
          type: integer
          description: Total number of items matching the query
        totalPages:
          type: integer
          description: Total number of pages
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          minLength: 1
        password:
          type: string
          minLength: 1
    LoginResponse:
      type: object
      required: [token, role]
      properties:
        token:
          type: string
        role:
          type: string
    ResourceType:
      type: string
      enum:
        - host
        - database_instance
        - database_cluster
        - service
        - domain_name
        - virtual_ip
        - database_proxy
        - control_plane_component
    RelationType:
      type: string
      enum:
        - depends_on
        - member_of
        - runs_on
        - points_to
        - fronts
        - manages
        - replicates_to
    LifecycleStatus:
      type: string
      enum:
        - provisioning
        - running
        - stopped
        - degraded
        - decommissioning
    HealthStatus:
      type: string
      enum:
        - healthy
        - warning
        - critical
        - unknown
    DictionaryItem:
      type: object
      required: [key, label, description]
      properties:
        key:
          type: string
        label:
          type: string
        description:
          type: string
    ResourceDetailResponse:
      type: object
      required:
        - resource
      properties:
        resource:
          $ref: "#/components/schemas/Resource"
    Resource:
      type: object
      required:
        - id
        - resourceType
        - resourceSubtype
        - name
        - displayName
        - environmentId
        - ownerId
        - lifecycleStatus
        - healthStatus
        - source
        - externalId
      properties:
        id:
          type: integer
          format: int64
        resourceType:
          $ref: "#/components/schemas/ResourceType"
        resourceSubtype:
          type: string
        name:
          type: string
        displayName:
          type: string
        environmentId:
          type: integer
          format: int64
        clusterId:
          type: integer
          nullable: true
          description: "For database instances, the ID of the parent cluster via member_of relation. Null for clusters and other resource types."
        ownerId:
          type: integer
          format: int64
        lifecycleStatus:
          $ref: "#/components/schemas/LifecycleStatus"
        healthStatus:
          $ref: "#/components/schemas/HealthStatus"
        source:
          type: string
        externalId:
          type: string
        labels:
          type: object
          additionalProperties:
            type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        archivedAt:
          type: string
          format: date-time
          nullable: true
          description: Timestamp when the resource was archived (null if active)
        archivedBy:
          type: integer
          format: int64
          nullable: true
          description: ID of the user or system that archived the resource
        archiveReason:
          type: string
          nullable: true
          description: Human-readable reason for archiving
        profileSummary:
          nullable: true
          description: Embedded profile summary (present when includeProfile=true query param is set)
          additionalProperties: true
          properties:
            engine:
              type: string
            version:
              type: string
            host:
              type: string
            port:
              type: integer
            role:
              type: string
          type: object
    ResourceRelation:
      type: object
      required: [id, fromResourceId, toResourceId, relationType, createdAt]
      properties:
        id:
          type: integer
          format: int64
        fromResourceId:
          type: integer
          format: int64
        toResourceId:
          type: integer
          format: int64
        relationType:
          $ref: "#/components/schemas/RelationType"
        createdAt:
          type: string
          format: date-time
    AuditEvent:
      type: object
      required: [id, actorUserId, eventType, result, createdAt]
      properties:
        id:
          type: integer
          format: int64
        actorUserId:
          type: integer
          format: int64
        targetResourceId:
          type: integer
          format: int64
        eventType:
          type: string
        result:
          type: string
        createdAt:
          type: string
          format: date-time
    Environment:
      type: object
      required: [id, name, slug, description, createdAt]
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        slug:
          type: string
        description:
          type: string
        createdAt:
          type: string
          format: date-time
    Owner:
      type: object
      required: [id, name, email, createdAt]
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        email:
          type: string
          format: email
        createdAt:
          type: string
          format: date-time
    Role:
      type: object
      required: [id, name, description, createdAt]
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        description:
          type: string
        createdAt:
          type: string
          format: date-time
    ResourceProfileResponse:
      type: object
      required: [resourceId, resourceType, resourceSubtype, profile]
      properties:
        resourceId:
          type: integer
          format: int64
        resourceType:
          $ref: "#/components/schemas/ResourceType"
        resourceSubtype:
          type: string
        profile:
          type: object
          additionalProperties: true
          description: >
            Typed profile fields.  Keys depend on resourceType:
            - database_instance: engine, version, host, port, role
            - database_cluster: engine, topologyMode, primaryEndpoint
            - service: systemName, repositoryUrl, runtimeEnv
            - host: hostname, ipAddress, osName
    ResourceCreateInput:
      type: object
      required:
        - resourceType
        - name
        - displayName
        - environmentId
        - ownerId
        - lifecycleStatus
        - healthStatus
        - source
      properties:
        resourceType:
          $ref: "#/components/schemas/ResourceType"
        resourceSubtype:
          type: string
        name:
          type: string
          minLength: 1
          pattern: "^[a-z0-9][a-z0-9._-]*$"
        displayName:
          type: string
          minLength: 1
        environmentId:
          type: integer
          format: int64
        ownerId:
          type: integer
          format: int64
        lifecycleStatus:
          $ref: "#/components/schemas/LifecycleStatus"
        healthStatus:
          $ref: "#/components/schemas/HealthStatus"
        source:
          type: string
          enum: [manual]
        externalId:
          type: string
        labels:
          type: object
          additionalProperties:
            type: string
        profile:
          type: object
          additionalProperties: true
          description: >-
            Optional typed profile fields to persist during resource creation.
            Supported keys depend on resourceType/resourceSubtype.
    ResourcePatchRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          pattern: "^[a-z0-9][a-z0-9._-]*$"
        resourceSubtype:
          type: string
        displayName:
          type: string
          minLength: 1
        environmentId:
          type: integer
          format: int64
        ownerId:
          type: integer
          format: int64
        lifecycleStatus:
          $ref: "#/components/schemas/LifecycleStatus"
        healthStatus:
          $ref: "#/components/schemas/HealthStatus"
        source:
          type: string
          enum: [manual]
        externalId:
          type: string
        labels:
          type: object
          additionalProperties:
            type: string
    RelationCreateInput:
      type: object
      required:
        - toResourceId
        - relationType
      properties:
        toResourceId:
          type: integer
          format: int64
        relationType:
          $ref: "#/components/schemas/RelationType"
    ArchiveRequest:
      type: object
      properties:
        reason:
          type: string
          maxLength: 512
          description: Optional human-readable reason for archiving. If provided, must be non-blank.
    ErrorResponse:
      type: object
      required: [error, message]
      properties:
        error:
          type: string
          description: Machine-readable error code
        message:
          type: string
          description: Human-readable error description
        details:
          type: object
          additionalProperties:
            type: string
          description: Optional field-level validation details
    TopologyResponse:
      type: object
      required: [rootResourceId, depth, direction, nodes, edges, groups, isDatabaseTopology]
      properties:
        rootResourceId:
          type: integer
          format: int64
          description: ID of the root resource the topology is centered on
        depth:
          type: integer
          description: Traversal depth used for this response (1 or 2)
        direction:
          type: string
          enum: [both, upstream, downstream]
          description: Direction filter used for this response
        nodes:
          type: array
          items:
            $ref: "#/components/schemas/TopologyNode"
          description: >
            De-duplicated nodes sorted by distance, then resource type,
            then name, then id. Root node is always first.
        edges:
          type: array
          items:
            $ref: "#/components/schemas/TopologyEdge"
          description: >
            De-duplicated edges sorted by relation type, fromResourceId,
            toResourceId, then id.
        groups:
          type: array
          items:
            $ref: "#/components/schemas/TopologyGroup"
          description: Optional grouping of nodes by resource type
        isDatabaseTopology:
          type: boolean
          description: >
            True if any node is a database_cluster or database_instance.
            Frontend uses this flag to switch to the layered database
            graph renderer.
    TopologyNode:
      type: object
      required:
        - id
        - resourceType
        - resourceSubtype
        - name
        - displayName
        - environmentId
        - ownerId
        - lifecycleStatus
        - healthStatus
        - isRoot
        - distance
        - topologyRole
        - topologyLayer
        - visualImportance
        - isDatabaseTopology
      properties:
        id:
          type: integer
          format: int64
        resourceType:
          $ref: "#/components/schemas/ResourceType"
        resourceSubtype:
          type: string
        name:
          type: string
        displayName:
          type: string
        environmentId:
          type: integer
          format: int64
        ownerId:
          type: integer
          format: int64
        lifecycleStatus:
          $ref: "#/components/schemas/LifecycleStatus"
        healthStatus:
          $ref: "#/components/schemas/HealthStatus"
        isRoot:
          type: boolean
          description: True if this node is the root resource
        distance:
          type: integer
          description: Hop distance from root (0 for root itself)
        topologyRole:
          $ref: "#/components/schemas/TopologyRole"
        topologyLayer:
          $ref: "#/components/schemas/TopologyLayer"
        groupKey:
          type: string
          description: >
            Grouping key for database instances. Format "cluster:{clusterId}".
            Set when the instance has a member_of relation to a database_cluster.
            Absent for non-instance nodes and instances without cluster membership.
        visualImportance:
          type: integer
          minimum: 1
          maximum: 10
          description: >
            Relative visual prominence (1-10). Root=10, primary=9, cluster=8,
            proxy_active=7, entry/service=6, replica_intermediate=5,
            replica/proxy_standby=4, control_plane=3, host=2, generic=1.
        isDatabaseTopology:
          type: boolean
          description: >
            True when any node in the topology is a database_cluster or
            database_instance. Mirrors the response-level flag for per-node
            convenience.
        replicationDepth:
          type: integer
          description: >
            Hop count from the replication primary (depth 0) along
            replicates_to edges. Only set for database_instance nodes
            that participate in a replication chain.
        replicationParentId:
          type: integer
          format: int64
          description: >
            ID of the upstream replication source. Only set for
            database_instance nodes that participate in a replication chain.
            Omitted for the primary (root of the chain).
    TopologyEdge:
      type: object
      required: [id, fromResourceId, toResourceId, relationType, semanticType]
      properties:
        id:
          type: integer
          format: int64
        fromResourceId:
          type: integer
          format: int64
        toResourceId:
          type: integer
          format: int64
        relationType:
          $ref: "#/components/schemas/RelationType"
        semanticType:
          $ref: "#/components/schemas/EdgeSemanticType"
    TopologyGroup:
      type: object
      required: [id, label, resourceType, nodeIds]
      properties:
        id:
          type: integer
          format: int64
          description: Numeric group identifier for a logical cluster or resource-type grouping
        label:
          type: string
          description: Human-readable group label
        resourceType:
          $ref: "#/components/schemas/ResourceType"
        nodeIds:
          type: array
          items:
            type: integer
            format: int64
          description: IDs of nodes belonging to this group
    TopologyRole:
      type: string
      enum:
        - application
        - entry
        - proxy_active
        - proxy_standby
        - cluster
        - primary
        - replica
        - replica_intermediate
        - host
        - control_plane
        - service
        - generic
      description: >
        Semantic role a node plays in the topology graph. Determined by
        resourceType, labels, and relation edges. Frontend uses this to
        pick icons, colors, and layout position.
    TopologyLayer:
      type: string
      enum:
        - application
        - entry
        - cluster
        - replication
        - control_plane
        - host
        - generic
      description: >
        Semantic band/layer for top-to-bottom layered graph layout.
        Mapped 1:1 from TopologyRole (service→application, entry/proxy→entry,
        cluster→cluster, primary/replica→replication, control_plane→control_plane,
        host→host).
    EdgeSemanticType:
      type: string
      enum:
        - traffic
        - failover
        - replication
        - membership
        - placement
        - management
        - dependency
        - monitoring
      description: >
        Semantic meaning of a topology edge. Used by frontend to choose
        line style, color, and arrow rendering. Determined by relation type
        and node properties (e.g., fronts from standby proxy → failover,
        manages from HA subtype → monitoring).
