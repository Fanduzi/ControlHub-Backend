  /query-targets/{id}/schema/object-details:
    get:
      summary: Get columns, indexes, and foreign keys for a database object
      operationId: getQueryTargetObjectDetails
      description: >
        Phase 38I. Returns full column, index, and foreign key metadata for
        one table or view. The response may be truncated for very large
        objects — the truncated flags indicate which sections are incomplete.
        Requires a fresh Bearer token. Never returns credentials, DSNs, or
        sample data.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
            minimum: 1
          description: Query target resource ID.
        - name: database
          in: query
          required: true
          schema:
            type: string
            minLength: 1
          description: Database name.
        - name: object
          in: query
          required: true
          schema:
            type: string
            minLength: 1
          description: Object (table/view) name.
      responses:
        "200":
          description: Object detail with columns, indexes, and foreign keys
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ObjectDetailResponse"
              example:
                targetResourceId: 616
                database: "query_e2e"
                name: "query_e2e_items"
                kind: "table"
                columns:
                  - name: "id"
                    ordinalPosition: 1
                    databaseType: "bigint"
                    nullable: false
                    primaryKey: true
                    autoIncrement: false
                indexes:
                  - name: "PRIMARY"
                    columns: ["id"]
                    unique: true
                    primary: true
                foreignKeys:
                  - name: "fk_item_category"
                    columns: ["category_id"]
                    referencedDatabase: "query_e2e"
                    referencedObject: "query_e2e_categories"
                    referencedColumns: ["id"]
                    onUpdate: "RESTRICT"
                    onDelete: "RESTRICT"
                truncated:
                  columns: false
                  indexes: false
                  foreignKeys: false
        "400":
          description: Invalid parameters (missing database/object, bad id)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Missing or invalid Bearer token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Query target or object not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "502":
          description: Target database rejected or connection failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /query-targets/{id}/schema/table-definition:
    get:
      summary: Get MySQL table definition for a verified base table
      operationId: getQueryTargetTableDefinition
      description: >
        Phase 38K Delivery B. Returns a governed MySQL SHOW CREATE TABLE
        result for a single verified base table. The server first verifies
        the requested database/name pair is a BASE TABLE via parameterized
        information_schema.TABLES lookup, then executes SHOW CREATE TABLE
        with server-side quoted identifiers. Definition text is capped at
        64 KiB UTF-8 with an explicit truncated flag. The endpoint never
        caches, persists, or logs definition text. Views and non-table
        objects are rejected. Requires a fresh Bearer token.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
            minimum: 1
          description: Query target resource ID.
        - name: database
          in: query
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 128
          description: Database name.
        - name: name
          in: query
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 128
          description: Table name.
      responses:
        "200":
          description: >
            MySQL table definition. The definition field contains the
            engine-produced SHOW CREATE TABLE output, bounded to 64 KiB
            UTF-8. If truncated is true, the definition is incomplete.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TableDefinitionResponse"
              example:
                targetResourceId: 42
                database: "orders"
                name: "order_items"
                kind: "table"
                dialect: "mysql"
                definition: "CREATE TABLE `order_items` (`id` bigint unsigned NOT NULL)"
                truncated: false
        "400":
          description: >
            Invalid parameters (missing database/name, bad id, or object
            is a view/unsupported type).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Missing or invalid Bearer token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Target access denied by policy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Query target or table not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "408":
          description: Request timed out
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "502":
          description: Backend database error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /resources:
    get:
      summary: List resources
      operationId: listResources
      parameters:
        - in: query
          name: resourceType
          schema:
            type: array
            items:
              $ref: "#/components/schemas/ResourceType"
          style: form
          explode: true
          description: >-
            Filter by resource type (repeated for OR: ?resourceType=host&resourceType=database_instance).
            Across filter families = AND.
        - in: query
          name: environmentId
          schema:
            type: array
            items:
              type: integer
              format: int64
          style: form
          explode: true
          description: >-
            Filter by environment ID (repeated for OR). Across filter families = AND.
        - in: query
          name: lifecycleStatus
          schema:
            type: array
            items:
              $ref: "#/components/schemas/LifecycleStatus"
          style: form
          explode: true
          description: >-
            Filter by lifecycle status (repeated for OR). Across filter families = AND.
        - in: query
          name: healthStatus
          schema:
            type: array
            items:
              $ref: "#/components/schemas/HealthStatus"
          style: form
          explode: true
          description: >-
            Filter by health status (repeated for OR). Across filter families = AND.
        - in: query
          name: resourceSubtype
          schema:
            type: array
            items:
              type: string
          style: form
          explode: true
          description: >-
            Filter by resource subtype (repeated for OR: ?resourceSubtype=mysql&resourceSubtype=clickhouse).
            Across filter families = AND.
        - in: query
          name: q
          schema:
            type: string
          description: Free-text search over name, displayName, externalId
        - in: query
          name: page
          schema:
            type: integer
            default: 1
            minimum: 1
          description: Page number
        - in: query
          name: pageSize
          schema:
            type: integer
            default: 20
            minimum: 1
            maximum: 500
          description: Items per page
        - in: query
          name: includeArchived
          schema:
            type: boolean
            default: false
          description: Include archived resources in results (default excludes them)
        - in: query
          name: archivedOnly
          schema:
            type: boolean
            default: false
          description: >-
            Return only archived resources. Takes precedence over includeArchived
            when both are true.
      responses:
        "200":
          description: Resource list with pagination
          content:
            application/json:
              schema:
                type: object
                required: [items, pageInfo]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/Resource"
                  pageInfo:
                    $ref: "#/components/schemas/PageInfo"
              example:
                items:
                  - id: 4000000000000000001
                    resourceType: database_instance
                    resourceSubtype: mysql
                    name: order-mysql-prod
                    displayName: Order MySQL Prod
                    environmentId: 1000000000000000001
                    ownerId: 2000000000000000001
                    lifecycleStatus: running
                    healthStatus: healthy
                    source: manual
                    externalId: ext-order-mysql
                    labels:
                      team: order
                    createdAt: "2026-04-11T20:00:00Z"
                    updatedAt: "2026-04-11T20:00:00Z"
                pageInfo:
                  page: 1
                  pageSize: 20
                  totalItems: 64
                  totalPages: 4
                  hasNextPage: true
                  hasPreviousPage: false
        "400":
          description: Invalid query parameters
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    post:
      summary: Create a resource
      operationId: createResource
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResourceCreateInput"
            example:
              resourceType: "host"
