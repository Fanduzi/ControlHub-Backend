openapi: 3.1.0
info:
  title: ControlHub API
  version: 0.1.0
  description: >
    **Security note (Phase 1):** Write endpoints (POST, PATCH, DELETE) do not
    enforce authentication or authorization. Any caller reaching the server can
    create, modify, or delete resources and relations. This is acceptable for
    local development only. An auth middleware gate must be added before any
    network-accessible deployment.
servers:
  - url: http://localhost:8080
paths:
  /auth/login:
    post:
      summary: Login with local credentials
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
            example:
              email: "admin@example.com"
              password: "secret123"
      responses:
        "200":
          description: Login response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        "400":
          description: Invalid request payload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /health:
    get:
      summary: Health check
      operationId: getHealth
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    type: string
                    enum:
                      - ok
  /query-targets:
    get:
      summary: List query targets for the Query Workbench
      operationId: listQueryTargets
      description: >-
        Read-only query target context derived from existing database instance
        resources. Returns the structured context a locked Query Workbench shell
        needs: connection context, query capability, readiness, governance, and
        locked available actions. Query execution is never enabled in Phase 36:
        every target reports executionEnabled=false and every available action is
        false. Readiness and query kind are derived and returned for the client to
        filter; only engine and environmentId are filtered server-side. Does not
        execute queries, store credentials, or introspect live databases.
      parameters:
        - in: query
          name: engine
          schema:
            type: string
          description: >-
            Filter by database engine (e.g. mysql, postgresql, clickhouse, redis,
            mongodb). Case-insensitive. Unknown engines still appear as
            unsupported targets when no filter is set.
        - in: query
          name: environmentId
          schema:
            type: integer
            format: int64
            minimum: 1
          description: Filter by environment ID
        - in: query
          name: q
          schema:
            type: string
          description: Free-text search over target name, display name, host, and engine
        - in: query
          name: targetId
          schema:
            type: integer
            format: int64
            minimum: 1
          description: Exact target resource ID lookup for deep links and target switching
        - in: query
          name: page
          schema:
            type: integer
            default: 1
            minimum: 1
            maximum: 1000000000
          description: Page number (1-based). Must not exceed 1000000000.
        - in: query
          name: pageSize
          schema:
            type: integer
            default: 50
            minimum: 1
            maximum: 100
          description: Items per page. Defaults to 50 and is capped at 100.
      responses:
        "200":
          description: Query target list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QueryTargetListResponse"
              example:
                items:
                  - resourceId: 22
                    resourceName: analytics-ch-node-01-prod
                    displayName: Analytics ClickHouse Node 01 Production
                    resourceType: database_instance
                    connectionContext:
                      environment: Production
                      owner: DBA Team
                      engine: clickhouse
                      host: prod-ch-host-01.internal
                      port: 8123
                      clusterId: 14
                      clusterName: Analytics ClickHouse Cluster Production
                    capability:
                      queryKind: sql
                      editorMode: sql
                      languageLabel: SQL
                    readiness: credential_required
                    missingFields:
                      - readonlyCredential
                    governance:
                      executionEnabled: false
                      credentialState: missing_readonly_credential
                      auditRequired: true
                      safetyState: credential_missing
                      safetyNote: Query execution is not enabled in this phase.
                      policyNotes:
                        - Read-only credentials are required before execution.
                        - Production queries require stricter defaults.
                    availableActions:
                      run: false
                      explain: false
                      export: false
                      saveSheet: false
                      requestAccess: false
                    schemaPreview: []
                pageInfo:
                  page: 1
                  pageSize: 50
                  totalItems: 1
                  totalPages: 1
                  hasNextPage: false
                  hasPreviousPage: false
        "400":
          description: Invalid query parameters
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /query-targets/{id}/execute:
    post:
      summary: Execute a read-only SQL statement against a query target
      operationId: executeQueryTarget
      description: >
        Phase 37 read-only sandbox. Runs a single guarded MySQL/TiDB read-only
        SQL statement under a backend-owned credential, bounded timeout, row cap,
        and payload caps. Allowed statements: SELECT, SHOW DATABASES, SHOW TABLES,
        SHOW COLUMNS, DESCRIBE/DESC, EXPLAIN SELECT. Schema-qualified metadata
        forms (SHOW TABLES FROM db, SHOW COLUMNS FROM db.tbl, DESCRIBE db.tbl)
        are allowed. Requires a fresh Bearer token (bounded
        TTL). The actor is derived from the verified token and is never accepted
        in the request body. The resolved DSN is never returned.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
            minimum: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/QueryExecuteRequest"
            examples:
              acceptedSelect:
                value:
                  statement: "select 1 as value"
                  maxRows: 100
              acceptedShowTables:
                value:
                  statement: "show tables"
                  maxRows: 100
              rejectedUpdate:
                value:
                  statement: "update resources set name = 'x'"
                  maxRows: 100
      responses:
        "200":
          description: Execution result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QueryExecuteResponse"
              examples:
                success:
                  value:
                    executionId: 1001
                    status: success
                    targetResourceId: 22
                    engine: mysql
                    columns:
                      - {name: value, databaseType: BIGINT, nullable: false}
                    rows:
                      - [1]
                    rowCount: 1
                    truncated: false
                    durationMs: 18
                    limitApplied: 100
                    executedAt: "2026-06-22T08:30:00Z"
        "400":
          description: Validation failed (bad request, blocked statement, bad maxRows)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                blockedStatement:
                  value:
                    error: validation_failed
                    message: only read-only SQL statements are allowed
        "401":
          description: Missing or invalid Bearer token (or token older than the TTL)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Target not enabled or environment disallows execution
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Query target not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "408":
          description: Execution exceeded the timeout
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "502":
          description: Target database rejected or connection failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /query-targets/{id}/related-records:
    post:
      summary: Navigate to referenced records via a governed foreign key
      operationId: navigateRelatedRecords
      description: >
        Phase 38J governed FK record navigation. Resolves the source table's
        foreign key metadata from the live schema, constructs a parameterized
        SELECT from trusted referenced identifiers, binds local values via
        database/sql placeholders, and returns bounded result rows plus
        relation metadata. The browser never supplies referenced identifiers,
        SQL, credentials, DSN, or actor identity. Requires a fresh Bearer
        token (same TTL as query execution). Every attempt is recorded with
        fixed action "related_record_navigation" and relation identity only;
        localValues, result rows, SQL, credentials, and raw errors are never
        persisted.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
            minimum: 1
          description: Query target resource ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RelatedRecordNavigationRequest"
            examples:
              singleColumnFK:
                summary: Navigate via a single-column FK
                value:
                  source:
                    database: orders
                    object: order_items
                    kind: table
                    foreignKey: fk_order_items_order
                  localValues: ["42"]
                  maxRows: 100
              compositeFK:
                summary: Navigate via a composite FK (two columns)
                value:
                  source:
                    database: app
                    object: junction_table
                    kind: table
                    foreignKey: fk_junction_composite
                  localValues: ["10", "20"]
                  maxRows: 50
      responses:
        "200":
          description: Navigation result with bounded rows and relation metadata
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RelatedRecordNavigationResponse"
              examples:
                success:
                  value:
                    executionId: 2001
                    status: success
                    targetResourceId: 22
                    engine: mysql
                    columns:
                      - {name: id, databaseType: BIGINT, nullable: false}
                      - {name: name, databaseType: VARCHAR, nullable: true}
                    rows:
                      - [100, "Widget"]
                    rowCount: 1
                    truncated: false
                    durationMs: 12
                    limitApplied: 100
                    executedAt: "2026-07-14T08:00:00Z"
                    sourceDatabase: orders
                    sourceObject: order_items
                    foreignKey: fk_order_items_order
                    referencedDatabase: orders
                    referencedObject: orders
                    referencedColumns: ["id"]
        "400":
          description: >
            Validation failed (bad request shape, unknown source/FK, value
            count mismatch, non-table kind, overlong values)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                fkNotFound:
                  value:
                    error: validation_failed
                    message: "navigation source object or foreign key not found"
                valueMismatch:
                  value:
                    error: validation_failed
                    message: "localValues count does not match foreign key column count"
        "401":
          description: Missing or invalid Bearer token (or token older than the TTL)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Target not enabled or environment disallows execution
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Query target not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "408":
          description: Navigation exceeded the timeout
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "502":
          description: Target database rejected or connection failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /query-targets/{id}/credential:
    get:
      summary: Get query credential metadata status for a query target
      operationId: getQueryTargetCredential
      description: >
        Phase 38A. Returns the credential metadata status for a MySQL/TiDB query
        target — metadata only (opaque credential ref, enabled flag, environment
        policy, runtime status). It NEVER returns a DSN, password, host, or port.
        Requires a fresh Bearer token.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
            minimum: 1
      responses:
        "200":
          description: Credential metadata status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QueryCredentialStatusResponse"
              examples:
                missing:
                  value:
                    resourceId: 22
                    configured: false
                    engine: mysql
                    credentialRef: ""
                    enabled: false
                    environmentPolicy: disabled
                    runtimeStatus: missing_metadata
                    executionEligible: false
                    message: "No read-only credential reference is configured."
                resolved:
                  value:
                    resourceId: 22
                    configured: true
                    engine: mysql
                    credentialRef: ORDER_MYSQL_RO
                    enabled: true
                    environmentPolicy: non_prod_only
                    runtimeStatus: secret_resolved
                    executionEligible: true
                    message: "Read-only credential is configured and bound to this target."
        "400":
          description: Invalid target id
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Missing or invalid Bearer token (or token older than the TTL)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Query target not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Unexpected server failure
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    put:
      summary: Create or update query credential metadata for a query target
      operationId: putQueryTargetCredential
      description: >
        Phase 38A. Admin-only. Persists credential METADATA for a MySQL/TiDB query
        target: an opaque credential reference, an enabled flag, and an environment
        policy. The body must never carry a DSN, password, host, port, or actor
        field (unknown fields are rejected by strict decoding). The engine is
        derived from the target, never accepted from the request. Save succeeds
        even when the secret cannot be resolved yet; the returned runtimeStatus
        explains it and the target stays locked. Requires a fresh Bearer token and
        the admin role.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
            minimum: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/QueryCredentialUpsertRequest"
            examples:
              nonProd:
                value:
                  credentialRef: ORDER_MYSQL_RO
                  enabled: true
                  environmentPolicy: non_prod_only
              allEnvironments:
                value:
                  credentialRef: ORDER_MYSQL_RO
                  enabled: true
                  environmentPolicy: all_environments
                  confirmAllEnvironments: true
      responses:
        "200":
          description: Updated credential metadata status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QueryCredentialStatusResponse"
        "400":
          description: Validation failed (invalid id, invalid ref/policy, unknown/secret/actor field, all-environments confirmation missing)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Missing or invalid Bearer token (or token older than the TTL)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Authenticated actor is not an admin
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Query target not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Persistence conflict
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Unexpected server failure
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      summary: Remove query credential metadata for a query target
      operationId: deleteQueryTargetCredential
      description: >
        Phase 38A. Admin-only. Removes a target's credential metadata and returns
        204. After delete the target remains visible and locked as
        credential_required. Requires a fresh Bearer token and the admin role.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
            minimum: 1
      responses:
        "204":
          description: Credential metadata removed
        "400":
          description: Invalid target id
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Missing or invalid Bearer token (or token older than the TTL)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Authenticated actor is not an admin
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Query target not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Unexpected server failure
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /query-targets/{id}/executions:
    get:
      summary: List execution history for a query target
      operationId: listQueryExecutions
      description: >
        Returns execution metadata (digest, status, row count, duration, errors,
        actor display name) only — never full result rows, email, or raw actor
        ids. Ordinary users see their own rows for the target; admins see all
        rows for the target. Unknown targets return 404. History is readable
        without current credential readiness. Requires a fresh Bearer token.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
            minimum: 1
        - name: page
          in: query
          description: >
            Legacy offset mode page number (1-based). Omit to use cursor mode
            (default): the first page starts from the newest row, and
            `nextCursor` is returned for continuation. Supply `page` explicitly
            to use offset mode with `pageInfo` (COUNT + OFFSET). `page` and
            `cursor` are mutually exclusive.

            An explicitly supplied but invalid `page` (empty, zero, negative,
            non-integer, or repeated) returns `400 validation_failed` and does
            not invoke the history service; only an absent `page` selects
            cursor-initial mode.
          schema:
            type: integer
            minimum: 1
        - name: pageSize
          in: query
          description: >
            Items per page. Defaults to 20 when omitted. Must be an integer in
            `1..500` when supplied; an explicitly supplied but invalid `pageSize`
            (empty, zero, negative, non-integer, greater than 500, or repeated)
            returns `400 validation_failed` and does not invoke the history
            service. Applies identically to cursor and offset modes.
          schema:
            type: integer
            minimum: 1
            maximum: 500
            default: 20
        - name: status
          in: query
          description: Filter by execution status.
          schema:
            type: string
            enum: [success, rejected, failed, timeout]
        - name: from
          in: query
          description: Inclusive start (RFC3339).
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          description: Exclusive end (RFC3339).
          schema:
            type: string
            format: date-time
        - name: cursor
          in: query
          description: >
            Opaque continuation token (cursor mode only). The example value
            below is illustrative and must not be reused as an authorization
            artifact; the `q` field is an unkeyed query-context digest, not a
            signature. A cursor is only valid for the exact filter context and
            actor scope that produced it.
          schema:
            type: string
      responses:
        "200":
          description: Cursor-paginated execution history
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QueryExecutionCursorPage"
              examples:
                history:
                  value:
                    items:
                      - id: 1001
                        targetResourceId: 22
                        actor:
                          displayName: "ControlHub Admin"
                        engine: mysql
                        statementDigest: "select id, name from resources where resource_type = ? limit ?"
                        statementPreview: "select id, name from resources where resource_type = 'service' limit 20"
                        status: success
                        rowCount: 1
                        durationMs: 18
                        errorCode: ""
                        errorMessage: ""
                        createdAt: "2026-06-22T08:30:00Z"
                    nextCursor: null
                cursor:
                  value:
                    items:
                      - id: 1002
                        targetResourceId: 22
                        actor:
                          displayName: "ControlHub Admin"
                        engine: mysql
                        statementDigest: "select id, name from resources where resource_type = ? limit ?"
                        statementPreview: "select id, name from resources where resource_type = 'service' limit 20"
                        status: success
                        rowCount: 5
                        durationMs: 42
                        errorCode: ""
                        errorMessage: ""
                        createdAt: "2026-06-22T09:15:00Z"
                    nextCursor: "eyJ2IjoxLCJ0IjoiMjAyNi0wNi0yMlQwOToxNTowMFoiLCJpZCI6IjEwMDIiLCJxIjoiNjQwODcyNjU3MWM5ZTIzZDA5YjEwMzk4YjQyYWU3NDRiNmJiMDljMWMwODMxNGEyMDNlNGJjNjU2OTc2NTBiMiJ9"
        "400":
          description: >
            Validation failed: invalid status enum, invalid RFC3339 timestamp,
            inverted time window (from >= to), page+cursor mutual exclusion
            conflict, invalid explicit `page` (empty, zero, negative,
            non-integer, or repeated), or invalid explicit `pageSize` (empty,
            zero, negative, non-integer, greater than 500, or repeated).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                invalidStatus:
                  value:
                    error: validation_failed
                    message: "invalid status: must be one of success, rejected, failed, timeout"
                invalidTimestamp:
                  value:
                    error: validation_failed
                    message: "from parameter must be a valid RFC3339 timestamp"
                pageCursorConflict:
                  value:
                    error: validation_failed
                    message: "cannot use both page and cursor parameters"
                invalidPage:
                  value:
                    error: validation_failed
                    message: "page parameter must be a positive integer"
                invalidPageSize:
                  value:
                    error: validation_failed
                    message: "pageSize parameter must be an integer in 1..500"
        "401":
          description: Missing or invalid Bearer token (or token older than the TTL)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Query target not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                targetNotFound:
                  value:
                    error: query_target_not_found
                    message: "query target does not exist"
  /query-targets/{id}/schema/databases:
    get:
      summary: List databases for a query target
      operationId: listQueryTargetDatabases
      description: >
        Phase 38I. Returns the list of databases visible to the target's
        read-only credential. The default database (if known) is flagged.
        Requires a fresh Bearer token. Never returns credentials or DSNs.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
            minimum: 1
          description: Query target resource ID.
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
          description: Page number (1-based).
        - name: pageSize
          in: query
          schema:
            type: integer
            minimum: 1
            default: 50
            maximum: 100
          description: Items per page. Defaults to 50, capped at 100.
      responses:
        "200":
          description: Database list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DatabaseListResponse"
              example:
                targetResourceId: 616
                defaultDatabase: "query_e2e"
                items:
                  - name: "query_e2e"
                    isDefault: true
                pageInfo:
                  page: 1
                  pageSize: 50
                  totalItems: 1
                  totalPages: 1
                  hasNextPage: false
                  hasPreviousPage: false
        "400":
          description: Invalid parameters
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Missing or invalid Bearer token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Query target not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "502":
          description: Target database rejected or connection failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /query-targets/{id}/schema/objects:
    get:
      summary: List tables and views in a database
      operationId: listQueryTargetObjects
      description: >
        Phase 38I. Returns tables and views in the specified database for a
        query target. Requires a fresh Bearer token. Never returns credentials
        or DSNs.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
            minimum: 1
          description: Query target resource ID.
        - name: database
          in: query
          required: true
          schema:
            type: string
            minLength: 1
          description: Database name to list objects from.
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
          description: Page number (1-based).
        - name: pageSize
          in: query
          schema:
            type: integer
            minimum: 1
            default: 50
            maximum: 100
          description: Items per page. Defaults to 50, capped at 100.
      responses:
        "200":
          description: Object list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ObjectListResponse"
              example:
                targetResourceId: 616
                database: "query_e2e"
                items:
                  - database: "query_e2e"
                    name: "query_e2e_items"
                    kind: "table"
