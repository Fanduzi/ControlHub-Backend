                    items:
                      $ref: "#/components/schemas/DictionaryItem"
  /relation-types:
    get:
      summary: List relation types
      operationId: listRelationTypes
      responses:
        "200":
          description: Relation type dictionary
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/DictionaryItem"
  /lifecycle-statuses:
    get:
      summary: List lifecycle statuses
      operationId: listLifecycleStatuses
      responses:
        "200":
          description: Lifecycle status dictionary
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/DictionaryItem"
  /health-statuses:
    get:
      summary: List health statuses
      operationId: listHealthStatuses
      responses:
        "200":
          description: Health status dictionary
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/DictionaryItem"
  /resource-subtypes:
    get:
      summary: List resource subtypes for a given resource type
      operationId: listResourceSubtypes
      parameters:
        - in: query
          name: resourceType
          required: true
          schema:
            $ref: "#/components/schemas/ResourceType"
          description: The resource type to list subtypes for
      responses:
        "200":
          description: Resource subtypes
          content:
            application/json:
              schema:
                type: object
                required: [resourceType, subtypes]
                properties:
                  resourceType:
                    type: string
                  subtypes:
                    type: array
                    items:
                      $ref: "#/components/schemas/DictionaryItem"
        "400":
          description: Missing or invalid resourceType parameter
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  # ──────────────────────────────────────────────────────────────
  # IMPLEMENTED: Topology read model endpoint
  # ──────────────────────────────────────────────────────────────
  /resources/{id}/topology:
    get:
      summary: Get resource topology
      description: >
        Read-only topology projection around a root resource, built from
        existing resources and relations. Returns nodes, edges, and
        optional groups for graph visualization. Supports depth (1 or 2)
        and directional filtering (upstream, downstream, or both).
      operationId: getResourceTopology
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
            format: int64
          description: Root resource ID
        - in: query
          name: depth
          schema:
            type: integer
            enum: [1, 2]
            default: 1
          description: Traversal depth (1 = direct neighbors, 2 = two hops)
        - in: query
          name: direction
          schema:
            type: string
            enum: [both, upstream, downstream]
            default: both
          description: >
            Expansion direction relative to the root.
            `downstream`: edges where root is fromResourceId.
            `upstream`: edges where root is toResourceId.
            `both`: include both.
        - in: query
          name: relationType
          schema:
            $ref: "#/components/schemas/RelationType"
          description: Optional filter to include only edges of this relation type
      responses:
        "200":
          description: Topology projection
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TopologyResponse"
              example:
                rootResourceId: 4000000000000000001
                depth: 1
                direction: both
                isDatabaseTopology: true
                nodes:
                  - id: 4000000000000000001
                    resourceType: database_cluster
                    resourceSubtype: mysql
                    name: order-mysql-cluster-prod
                    displayName: Order MySQL Cluster Prod
                    environmentId: 1000000000000000001
                    ownerId: 2000000000000000002
                    lifecycleStatus: running
                    healthStatus: healthy
                    isRoot: true
                    distance: 0
                    topologyRole: cluster
                    topologyLayer: cluster
                    visualImportance: 10
                    isDatabaseTopology: true
                  - id: 4000000000000000002
                    resourceType: database_instance
                    resourceSubtype: mysql
                    name: order-mysql-1-prod
                    displayName: Order MySQL 1 Prod
                    environmentId: 1000000000000000001
                    ownerId: 2000000000000000002
                    lifecycleStatus: running
                    healthStatus: healthy
                    isRoot: false
                    distance: 1
                    topologyRole: primary
                    topologyLayer: replication
                    groupKey: "cluster:4000000000000000001"
                    visualImportance: 9
                    isDatabaseTopology: true
                    replicationDepth: 0
                edges:
                  - id: 5000000000000000001
                    fromResourceId: 4000000000000000002
                    toResourceId: 4000000000000000001
                    relationType: member_of
                    semanticType: membership
                groups:
                  - id: 1
                    label: Database Cluster
                    resourceType: database_cluster
                    nodeIds:
                      - 4000000000000000001
                  - id: 2
                    label: Database Instance
                    resourceType: database_instance
                    nodeIds:
                      - 4000000000000000002
        "400":
          description: Invalid query parameters
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Root resource not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: >
        ControlHub HMAC-SHA256 bearer token from POST /auth/login. Query execution
        routes require a token within a bounded TTL (QueryExecutionTokenMaxAge).
  schemas:
    QueryTargetListResponse:
      type: object
      required: [items, pageInfo]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/QueryTarget"
        pageInfo:
          $ref: "#/components/schemas/PageInfo"
    QueryTarget:
      type: object
      description: >-
        Read-only query capability context for one database resource, ready to
        drive a locked Query Workbench shell. No credentials or execution state.
      required: [resourceId, resourceName, displayName, resourceType, connectionContext, capability, readiness, missingFields, governance, availableActions, schemaPreview]
      properties:
        resourceId:
          type: integer
          format: int64
        resourceName:
          type: string
        displayName:
          type: string
        resourceType:
          $ref: "#/components/schemas/ResourceType"
        connectionContext:
          $ref: "#/components/schemas/QueryTargetConnectionContext"
        capability:
          $ref: "#/components/schemas/QueryTargetCapability"
        readiness:
          $ref: "#/components/schemas/QueryTargetReadiness"
        missingFields:
          type: array
          items:
            type: string
          description: Configuration gaps (e.g. host, port, engine, readonlyCredential).
        governance:
          $ref: "#/components/schemas/QueryTargetGovernance"
        availableActions:
          $ref: "#/components/schemas/QueryTargetAvailableActions"
        schemaPreview:
          type: array
          description: >-
            Lightweight schema placeholder derived only from existing metadata.
            Empty in Phase 36 — never the result of live database introspection.
          items:
            $ref: "#/components/schemas/QueryTargetSchemaPreviewNode"
    QueryTargetConnectionContext:
      type: object
      required: [environment, owner, engine, host, port]
      properties:
        environment:
          type: string
          description: Resolved environment name.
        owner:
          type: string
          description: Resolved owner name.
        engine:
          type: string
        host:
          type: string
        port:
          type: integer
        clusterId:
          type: integer
          format: int64
        clusterName:
          type: string
    QueryTargetCapability:
      type: object
      required: [queryKind, editorMode, languageLabel]
      properties:
        queryKind:
          $ref: "#/components/schemas/QueryKind"
        editorMode:
          type: string
          enum: [sql, redis, mongo, text]
        languageLabel:
          type: string
    QueryKind:
      type: string
      enum:
        - sql
        - redis
        - mongo
        - unsupported
    QueryTargetReadiness:
      type: string
      description: >-
        Explicit readiness. Phase 36 normally returns credential_required or
        missing_connection; ready only when concrete read-only credential
        metadata exists.
      enum:
        - ready
        - missing_connection
        - credential_required
        - unsupported_engine
        - disabled
    QueryTargetSafetyState:
      type: string
      enum:
        - credential_missing
        - execution_disabled
        - unsupported_engine
        - connection_incomplete
        - readonly_sandbox_enabled
    QueryTargetGovernance:
      type: object
      required: [executionEnabled, credentialState, auditRequired, safetyState, safetyNote, policyNotes]
      properties:
        executionEnabled:
          type: boolean
          description: True only for ready mysql/tidb targets with an allowed credential (Phase 37).
        credentialState:
          type: string
          description: >-
            Backend-owned credential state for the target. On the Phase 38A
            runtime-backed readiness path (resolver wired in production) it mirrors
            QueryCredentialRuntimeStatus; on the legacy metadata-only path it is
            one of missing_readonly_credential / configured_readonly_credential.
            Clients must map these to localized labels and never render the raw
            enum string.
          enum:
            - missing_metadata
            - invalid_ref
            - disabled
            - policy_blocked
            - secret_missing
            - binding_mismatch
            - secret_resolved
            - unsupported_target
            - incomplete_connection
            - missing_readonly_credential
            - configured_readonly_credential
        auditRequired:
          type: boolean
        safetyState:
          $ref: "#/components/schemas/QueryTargetSafetyState"
        safetyNote:
          type: string
        policyNotes:
          type: array
          items:
            type: string
    QueryTargetAvailableActions:
      type: object
      description: Locked/unlocked action flags. All false in Phase 36.
      required: [run, explain, export, saveSheet, requestAccess]
      properties:
        run:
          type: boolean
        explain:
          type: boolean
        export:
          type: boolean
        saveSheet:
          type: boolean
        requestAccess:
          type: boolean
    QueryTargetSchemaPreviewNode:
      type: object
      required: [kind, name]
      properties:
        kind:
          type: string
        name:
          type: string
        children:
          type: array
          items:
            $ref: "#/components/schemas/QueryTargetSchemaPreviewNode"
    QueryEnvironmentPolicy:
      type: string
      description: >-
        Controls which environments a credential may execute against. Unknown or
        empty values fail closed. all_environments opens production execution and
        requires explicit confirmation on write.
      enum: [disabled, non_prod_only, all_environments]
    QueryCredentialRuntimeStatus:
      type: string
      description: >-
        Backend runtime status of a query target's credential binding. Only
        secret_resolved can make a target execution-eligible. These strings are
        the backend contract; clients must map them to localized labels and must
        never render the raw enum.
      enum:
        - missing_metadata
        - invalid_ref
        - disabled
        - policy_blocked
        - secret_missing
        - binding_mismatch
        - secret_resolved
        - unsupported_target
        - incomplete_connection
    QueryCredentialStatusResponse:
      type: object
      description: >-
        Metadata-only credential status for a query target. Carries the opaque
        credential reference, enabled flag, environment policy, and runtime
        status. It NEVER carries a DSN, password, host, or port.
      required: [resourceId, configured, engine, credentialRef, enabled, environmentPolicy, runtimeStatus, executionEligible, message]
      additionalProperties: false
      properties:
        resourceId:
          type: integer
          format: int64
        configured:
          type: boolean
          description: True when credential metadata exists for the target.
        engine:
          type: string
          description: Target engine (mysql/tidb), derived by the backend.
        credentialRef:
          type: string
          description: Opaque, validated credential reference. Empty when unconfigured.
        enabled:
          type: boolean
        environmentPolicy:
          $ref: "#/components/schemas/QueryEnvironmentPolicy"
        runtimeStatus:
          $ref: "#/components/schemas/QueryCredentialRuntimeStatus"
        executionEligible:
          type: boolean
          description: True only when runtimeStatus is secret_resolved.
        message:
          type: string
          description: Fixed, client-safe status message. Never echoes a DSN.
    QueryCredentialUpsertRequest:
      type: object
      description: >-
        Body of PUT /query-targets/{id}/credential. Metadata only. It must NEVER
        carry a DSN, password, host, port, or actor field — unknown fields are
        rejected by strict decoding (additionalProperties is false). The engine is
        derived from the target, never accepted here.
      required: [credentialRef, enabled, environmentPolicy]
      additionalProperties: false
      properties:
        credentialRef:
          type: string
          pattern: '^[A-Z0-9_]+$'
          maxLength: 64
          description: Opaque, validated credential reference ([A-Z0-9_]+, max 64).
        enabled:
          type: boolean
        environmentPolicy:
          $ref: "#/components/schemas/QueryEnvironmentPolicy"
        confirmAllEnvironments:
          type: boolean
          description: Required true when environmentPolicy is all_environments.
    ObjectKind:
      type: string
      description: >-
        Classifies a database object as either a table or a view. Unknown
        kinds are rejected by the backend.
      enum: [table, view]
    DatabaseSummary:
      type: object
      required: [name, isDefault]
      properties:
        name:
          type: string
          description: Database name.
        isDefault:
          type: boolean
          description: True when this is the default database for the target.
    ObjectSummary:
      type: object
      required: [database, name, kind]
      properties:
        database:
          type: string
          description: Parent database name.
        name:
          type: string
          description: Object (table/view) name.
        kind:
          $ref: "#/components/schemas/ObjectKind"
    ColumnDetail:
      type: object
      required: [name, databaseType, ordinalPosition, nullable, primaryKey, autoIncrement]
      properties:
        name:
          type: string
        databaseType:
          type: string
          description: Native database type string (e.g. bigint, varchar(255)).
        ordinalPosition:
          type: integer
          description: 1-based ordinal position of the column in the table.
        nullable:
          type: boolean
        primaryKey:
          type: boolean
        autoIncrement:
          type: boolean
    IndexDetail:
      type: object
      required: [name, columns, unique, primary]
      properties:
        name:
          type: string
        columns:
          type: array
          items:
            type: string
          description: Ordered list of column names in the index.
        unique:
          type: boolean
        primary:
          type: boolean
    ForeignKeyDetail:
      type: object
      required: [name, columns, referencedDatabase, referencedObject, referencedColumns, onUpdate, onDelete]
      properties:
        name:
          type: string
        columns:
          type: array
          items:
            type: string
          description: Ordered list of local column names in the FK.
        referencedDatabase:
          type: string
        referencedObject:
          type: string
        referencedColumns:
          type: array
          items:
            type: string
          description: Ordered list of referenced column names.
        onUpdate:
          type: string
          description: Referential action on update (e.g. RESTRICT, CASCADE).
        onDelete:
          type: string
          description: Referential action on delete (e.g. RESTRICT, CASCADE).
    TruncationFlags:
      type: object
      required: [columns, indexes, foreignKeys]
      properties:
        columns:
          type: boolean
          description: True when the columns list was truncated.
        indexes:
          type: boolean
          description: True when the indexes list was truncated.
        foreignKeys:
          type: boolean
          description: True when the foreign keys list was truncated.
    DatabaseListResponse:
      type: object
      required: [targetResourceId, items, pageInfo]
      properties:
        targetResourceId:
          type: integer
          format: int64
          description: Owning query target resource ID.
        defaultDatabase:
          type: string
          nullable: true
          description: Default database name for the target, if known.
        items:
          type: array
          items:
            $ref: "#/components/schemas/DatabaseSummary"
        pageInfo:
          $ref: "#/components/schemas/PageInfo"
    ObjectListResponse:
      type: object
      required: [targetResourceId, database, items, pageInfo]
      properties:
        targetResourceId:
          type: integer
          format: int64
        database:
          type: string
          description: The database these objects belong to.
        items:
          type: array
          items:
            $ref: "#/components/schemas/ObjectSummary"
        pageInfo:
          $ref: "#/components/schemas/PageInfo"
    ObjectDetailResponse:
      type: object
      required: [targetResourceId, database, name, kind, columns, indexes, foreignKeys, truncated]
      properties:
        targetResourceId:
          type: integer
          format: int64
        database:
          type: string
        name:
          type: string
        kind:
          $ref: "#/components/schemas/ObjectKind"
        columns:
          type: array
          items:
            $ref: "#/components/schemas/ColumnDetail"
        indexes:
          type: array
          items:
            $ref: "#/components/schemas/IndexDetail"
        foreignKeys:
          type: array
          items:
            $ref: "#/components/schemas/ForeignKeyDetail"
        truncated:
          $ref: "#/components/schemas/TruncationFlags"
    TableDefinitionResponse:
      type: object
      required:
        - targetResourceId
        - database
        - name
        - kind
        - dialect
        - definition
        - truncated
      properties:
        targetResourceId:
          type: integer
          format: int64
          description: Owning query target resource ID.
        database:
          type: string
          description: Database name.
        name:
          type: string
          description: Table name.
        kind:
          type: string
          enum:
            - table
          description: Object kind (always "table" for this endpoint).
        dialect:
          type: string
          enum:
            - mysql
          description: Database dialect (always "mysql" for this endpoint).
        definition:
          type: string
          description: >
            Engine-produced SHOW CREATE TABLE output. Bounded to 64 KiB
            UTF-8. If truncated is true, this is a valid UTF-8 prefix
            and the full definition is incomplete.
        truncated:
          type: boolean
          description: >
            True if the definition was capped at 64 KiB. Consumers must
            label the definition incomplete when this flag is set.
    PageInfo:
      type: object
      required: [page, pageSize, totalItems, totalPages, hasNextPage, hasPreviousPage]
      properties:
        page:
          type: integer
          description: Current page number (1-based)
        pageSize:
          type: integer
          description: Number of items per page
        totalItems:
          type: integer
          description: Total number of items matching the query
        totalPages:
          type: integer
          description: Total number of pages
        hasNextPage:
          type: boolean
          description: Whether there is a page after this one
        hasPreviousPage:
          type: boolean
          description: Whether there is a page before this one
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          minLength: 1
        password:
          type: string
          minLength: 1
    LoginResponse:
      type: object
      required: [token, role]
      properties:
        token:
          type: string
        role:
          type: string
    ResourceType:
      type: string
      enum:
        - host
        - database_instance
        - database_cluster
        - service
        - domain_name
        - virtual_ip
        - database_proxy
        - control_plane_component
    RelationType:
      type: string
      enum:
        - depends_on
        - member_of
        - runs_on
        - points_to
        - fronts
        - manages
        - replicates_to
    LifecycleStatus:
      type: string
      enum:
        - provisioning
        - running
        - stopped
        - degraded
        - decommissioning
    HealthStatus:
      type: string
      enum:
        - healthy
        - warning
        - critical
        - unknown
    DictionaryItem:
      type: object
      required: [key, label, description]
      properties:
        key:
          type: string
        label:
          type: string
        description:
          type: string
    ResourceDetailResponse:
      type: object
      required:
        - resource
      properties:
        resource:
          $ref: "#/components/schemas/Resource"
    Resource:
      type: object
      required:
        - id
        - resourceType
        - resourceSubtype
        - name
        - displayName
        - environmentId
        - ownerId
        - lifecycleStatus
        - healthStatus
        - source
        - externalId
      properties:
        id:
          type: integer
          format: int64
        resourceType:
          $ref: "#/components/schemas/ResourceType"
        resourceSubtype:
          type: string
        name:
          type: string
        displayName:
          type: string
        environmentId:
          type: integer
          format: int64
          minimum: 1
        clusterId:
          type: integer
          nullable: true
          description: "For database instances, the ID of the parent cluster via member_of relation. Null for clusters and other resource types."
        ownerId:
          type: integer
          format: int64
          minimum: 1
        lifecycleStatus:
          $ref: "#/components/schemas/LifecycleStatus"
        healthStatus:
          $ref: "#/components/schemas/HealthStatus"
        source:
          type: string
        externalId:
          type: string
        labels:
          type: object
          additionalProperties:
            type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        archivedAt:
          type: string
          format: date-time
          nullable: true
          description: Timestamp when the resource was archived (null if active)
        archivedBy:
          type: integer
          format: int64
          nullable: true
          description: ID of the user or system that archived the resource
        archiveReason:
          type: string
          nullable: true
          description: Human-readable reason for archiving
        profileSummary:
          $ref: "#/components/schemas/ProfileSummary"
        databaseOperationalSummary:
          $ref: "#/components/schemas/DatabaseOperationalSummary"
    ResourceRelation:
      type: object
      required: [id, fromResourceId, toResourceId, relationType, createdAt]
      properties:
        id:
          type: integer
          format: int64
        fromResourceId:
          type: integer
          format: int64
        toResourceId:
          type: integer
          format: int64
        relationType:
          $ref: "#/components/schemas/RelationType"
        createdAt:
          type: string
          format: date-time
    ResourceRelationView:
      type: object
      required:
        - id
        - fromResourceId
        - toResourceId
        - relationType
        - direction
        - relatedResourceId
        - relatedResourceName
        - relatedResourceDisplayName
        - relatedResourceType
        - relatedResourceSubtype
        - relatedResourceHealthStatus
        - relatedResourceLifecycleStatus
        - createdAt
      properties:
        id:
          type: integer
          format: int64
        fromResourceId:
          type: integer
          format: int64
        toResourceId:
          type: integer
          format: int64
        relationType:
          $ref: "#/components/schemas/RelationType"
        direction:
          type: string
          enum: [outgoing, incoming]
          description: >-
            Direction of the relation from the queried resource's perspective.
            `outgoing` means the queried resource is fromResourceId.
            `incoming` means the queried resource is toResourceId.
        relatedResourceId:
          type: integer
          format: int64
        relatedResourceName:
          type: string
        relatedResourceDisplayName:
          type: string
        relatedResourceType:
          $ref: "#/components/schemas/ResourceType"
        relatedResourceSubtype:
          type: string
        relatedResourceHealthStatus:
          $ref: "#/components/schemas/HealthStatus"
        relatedResourceLifecycleStatus:
          $ref: "#/components/schemas/LifecycleStatus"
        createdAt:
          type: string
          format: date-time
    ClusterMemberView:
      type: object
      required:
        - resourceId
        - name
        - displayName
        - resourceType
        - resourceSubtype
        - lifecycleStatus
        - healthStatus
      properties:
        resourceId:
          type: integer
          format: int64
        name:
          type: string
        displayName:
          type: string
        resourceType:
          $ref: "#/components/schemas/ResourceType"
        resourceSubtype:
          type: string
        lifecycleStatus:
          $ref: "#/components/schemas/LifecycleStatus"
        healthStatus:
          $ref: "#/components/schemas/HealthStatus"
        profileSummary:
          $ref: "#/components/schemas/ProfileSummary"
    ProfileSummary:
      nullable: true
      type: object
      description: >-
        Embedded profile summary populated from typed profile tables.
        Fields vary by resource type; only applicable fields are set.
      properties:
        engine:
          type: string
          description: Database engine (e.g. mysql, postgresql)
        version:
          type: string
          description: Engine version string (e.g. 8.0.36)
        hostname:
          type: string
          description: Host hostname (for host and instance types)
        ip:
          type: string
          description: IP address (for host type)
        port:
          type: integer
          description: Database listen port
        role:
          type: string
          description: Replication role (e.g. primary, replica)
        nodeCount:
          type: integer
          description: Number of member instances (for database_cluster)
    DatabaseOperationalSummary:
      nullable: true
      type: object
      description: >-
        Derived read-only database member rollup for operator list views.
        Populated for database_cluster resources. Counts are best-effort from
        the current read model.
      properties:
        memberCount:
          type: integer
          format: int64
          description: Total member instances in the cluster
        criticalMemberCount:
          type: integer
          format: int64
          description: Members with health_status = critical
        warningMemberCount:
          type: integer
          format: int64
          description: Members with health_status = warning
        stoppedMemberCount:
          type: integer
          format: int64
          description: Members with lifecycle_status = stopped
        degradedMemberCount:
          type: integer
          format: int64
          description: Members with lifecycle_status = degraded
        unknownRoleCount:
          type: integer
          format: int64
          description: Members without a recognized role
        primaryMemberCount:
          type: integer
          format: int64
          description: Members with primary/master/writer role
        replicaMemberCount:
          type: integer
          format: int64
          description: Members with replica/secondary/reader role
        worstMemberId:
          type: integer
          format: int64
          nullable: true
          description: ID of the worst-status member
        worstMemberName:
          type: string
          description: Display name of the worst-status member
        worstMemberStatus:
          type: string
          description: Health status of the worst-status member
    AuditEvent:
      type: object
      required: [id, actorUserId, eventType, result, createdAt]
      properties:
        id:
          type: integer
          format: int64
        actorUserId:
          type: integer
          format: int64
        targetResourceId:
          type: integer
          format: int64
        eventType:
          type: string
        result:
          type: string
        createdAt:
          type: string
          format: date-time
    Environment:
      type: object
      required: [id, name, slug, description, createdAt]
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        slug:
          type: string
        description:
          type: string
        createdAt:
          type: string
          format: date-time
    Owner:
      type: object
      required: [id, name, email, createdAt]
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        email:
          type: string
          format: email
        createdAt:
          type: string
          format: date-time
    Role:
      type: object
      required: [id, name, description, createdAt]
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        description:
          type: string
        createdAt:
          type: string
          format: date-time
    ResourceProfileResponse:
      type: object
      required: [resourceId, resourceType, resourceSubtype, profile]
      properties:
        resourceId:
          type: integer
          format: int64
        resourceType:
          $ref: "#/components/schemas/ResourceType"
        resourceSubtype:
          type: string
        profile:
          type: object
          additionalProperties: true
          description: >
            Typed profile fields.  Keys depend on resourceType:
            - database_instance: engine, version, host, port, role
            - database_cluster: engine, topologyMode, primaryEndpoint
            - service: systemName, repositoryUrl, runtimeEnv
            - host: hostname, ipAddress, osName
    ResourceCreateInput:
      type: object
      additionalProperties: false
      required:
        - resourceType
        - name
        - displayName
        - environmentId
        - ownerId
        - lifecycleStatus
        - healthStatus
        - source
      properties:
        resourceType:
          $ref: "#/components/schemas/ResourceType"
        resourceSubtype:
          type: string
        name:
          type: string
          minLength: 1
          pattern: "^[a-z0-9][a-z0-9._-]*$"
        displayName:
          type: string
          minLength: 1
        environmentId:
          type: integer
          format: int64
          minimum: 1
        ownerId:
          type: integer
          format: int64
          minimum: 1
        lifecycleStatus:
          $ref: "#/components/schemas/LifecycleStatus"
        healthStatus:
          $ref: "#/components/schemas/HealthStatus"
        source:
          type: string
          enum: [manual]
        externalId:
          type: string
        labels:
          type: object
          additionalProperties:
            type: string
        profile:
          type: object
          additionalProperties: true
          description: >-
            Optional typed profile fields to persist during resource creation.
            Supported keys depend on resourceType/resourceSubtype.
    ResourcePatchRequest:
      type: object
      minProperties: 1
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
          pattern: "^[a-z0-9][a-z0-9._-]*$"
        resourceSubtype:
          type: string
        displayName:
          type: string
          minLength: 1
        environmentId:
          type: integer
          format: int64
          minimum: 1
        ownerId:
          type: integer
          format: int64
          minimum: 1
        lifecycleStatus:
          $ref: "#/components/schemas/LifecycleStatus"
        healthStatus:
          $ref: "#/components/schemas/HealthStatus"
        source:
          type: string
          enum: [manual]
        externalId:
          type: string
        labels:
          type: object
          additionalProperties:
            type: string
    RelationCreateInput:
      type: object
      required:
        - toResourceId
        - relationType
      properties:
        toResourceId:
          type: integer
          format: int64
        relationType:
          $ref: "#/components/schemas/RelationType"
    ArchiveRequest:
      type: object
      properties:
        reason:
          type: string
          maxLength: 512
          description: Optional human-readable reason for archiving. If provided, must be non-blank.
    ErrorResponse:
      type: object
      required: [error, message]
      properties:
        error:
          type: string
          description: Machine-readable error code
        message:
          type: string
          description: Human-readable error description
        details:
          type: object
          additionalProperties:
            type: string
          description: Optional field-level validation details
    QueryExecuteRequest:
      type: object
      required: [statement]
      properties:
        statement:
          type: string
          description: >
            A single MySQL/TiDB read-only SQL statement. Allowed: SELECT, SHOW
            DATABASES, SHOW TABLES, SHOW COLUMNS, DESCRIBE/DESC, EXPLAIN SELECT.
            Schema-qualified metadata forms (SHOW TABLES FROM db, SHOW COLUMNS
            FROM db.tbl, DESCRIBE db.tbl) are allowed.
        maxRows:
          type: integer
          minimum: 0
          description: >
            Optional row cap for this execution. Zero/omitted uses the backend
            default; negative values are rejected. The backend caps this at its
            hard maximum (tighter for production).
    QueryResultColumn:
      type: object
      required: [name, databaseType, nullable]
      properties:
        name:
          type: string
        databaseType:
          type: string
        nullable:
          type: boolean
    QueryExecuteResponse:
      type: object
      required: [executionId, status, targetResourceId, engine, columns, rows, rowCount, truncated, durationMs, limitApplied, executedAt]
      properties:
        executionId:
          type: integer
          format: int64
        status:
          type: string
          enum: [success, rejected, failed, timeout]
        targetResourceId:
          type: integer
          format: int64
        engine:
          type: string
        columns:
          type: array
          items:
            $ref: "#/components/schemas/QueryResultColumn"
        rows:
          type: array
          description: JSON-safe result rows. Never includes credentials or DSNs.
          items:
            type: array
            items: {}
        rowCount:
          type: integer
        truncated:
          type: boolean
        durationMs:
          type: integer
        limitApplied:
          type: integer
        executedAt:
          type: string
          format: date-time
    RelatedRecordNavigationSource:
      type: object
      required: [database, object, kind, foreignKey]
      properties:
        database:
          type: string
          minLength: 1
          maxLength: 128
          description: Source database name
        object:
          type: string
          minLength: 1
          maxLength: 128
          description: Source table name
        kind:
          type: string
          enum: [table]
          description: Must be "table"; views are not supported
        foreignKey:
          type: string
          minLength: 1
          maxLength: 128
          description: >
            FK constraint name on the source table, as reported by schema
            metadata. The backend resolves referenced identifiers from this.
    RelatedRecordNavigationRequest:
      type: object
      required: [source, localValues]
      properties:
        source:
          $ref: "#/components/schemas/RelatedRecordNavigationSource"
        localValues:
          type: array
          minItems: 1
          maxItems: 16
          items:
            type: string
            maxLength: 1024
          description: >
            Ordered scalar values for the FK local columns. Count must match the
            FK column count exactly. Values are bound via database/sql
            placeholders; they are never interpolated into SQL. Empty strings
            are permitted when the column semantics allow them.
        maxRows:
          type: integer
          minimum: 0
          maximum: 500
          description: >
            Optional row cap. Zero/omitted uses the backend default (100);
            values above the hard maximum (500) are clamped.
    RelatedRecordNavigationResponse:
      type: object
      required:
        - executionId
        - status
        - targetResourceId
        - engine
        - columns
        - rows
        - rowCount
        - truncated
        - durationMs
        - limitApplied
        - executedAt
        - sourceDatabase
        - sourceObject
        - foreignKey
        - referencedDatabase
        - referencedObject
        - referencedColumns
      properties:
        executionId:
          type: integer
          format: int64
        status:
          type: string
          enum: [success, rejected, failed, timeout]
        targetResourceId:
          type: integer
          format: int64
        engine:
          type: string
        columns:
          type: array
          items:
            $ref: "#/components/schemas/QueryResultColumn"
        rows:
          type: array
          items:
            type: array
            items: {}
        rowCount:
          type: integer
        truncated:
          type: boolean
        durationMs:
          type: integer
        limitApplied:
          type: integer
        executedAt:
          type: string
          format: date-time
        sourceDatabase:
          type: string
          description: Source database from the request
        sourceObject:
          type: string
          description: Source table from the request
        foreignKey:
          type: string
          description: FK constraint name from the request
        referencedDatabase:
          type: string
          description: Referenced database resolved from FK metadata
        referencedObject:
          type: string
          description: Referenced table resolved from FK metadata
        referencedColumns:
          type: array
          items:
            type: string
          description: Referenced columns in schema ordinal order
    QueryExecutionActor:
      type: object
      required: [displayName]
      properties:
        displayName:
          type: string
          description: >
            Privacy-safe actor label for history. Never email or raw numeric
            user id. Missing/deleted users project as "Unknown user".
    QueryExecutionRecord:
      type: object
      required: [id, targetResourceId, actor, engine, statementDigest, statementPreview, status, rowCount, durationMs, errorCode, errorMessage, createdAt]
      properties:
        id:
          type: integer
          format: int64
        targetResourceId:
          type: integer
          format: int64
        actor:
          $ref: "#/components/schemas/QueryExecutionActor"
        engine:
          type: string
        statementDigest:
          type: string
          description: Literal-masked statement shape (never raw parameter values).
        statementPreview:
          type: string
        status:
          type: string
          enum: [success, rejected, failed, timeout]
        rowCount:
          type: integer
        durationMs:
          type: integer
        errorCode:
          type: string
        errorMessage:
          type: string
        createdAt:
          type: string
          format: date-time
    QueryExecutionCursorPage:
      type: object
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/QueryExecutionRecord"
        nextCursor:
          type: string
          nullable: true
          description: Continuation token for cursor mode. Null when no more rows or in offset mode.
        pageInfo:
          $ref: "#/components/schemas/PageInfo"
          description: Pagination metadata for offset mode (when ?page= is provided). Omitted in cursor mode.
    TopologyResponse:
      type: object
      required: [rootResourceId, depth, direction, nodes, edges, groups, isDatabaseTopology]
      properties:
        rootResourceId:
          type: integer
          format: int64
          description: ID of the root resource the topology is centered on
        depth:
          type: integer
          description: Traversal depth used for this response (1 or 2)
        direction:
          type: string
          enum: [both, upstream, downstream]
          description: Direction filter used for this response
        nodes:
          type: array
          items:
            $ref: "#/components/schemas/TopologyNode"
          description: >
            De-duplicated nodes sorted by distance, then resource type,
            then name, then id. Root node is always first.
        edges:
          type: array
          items:
            $ref: "#/components/schemas/TopologyEdge"
          description: >
            De-duplicated edges sorted by relation type, fromResourceId,
            toResourceId, then id.
        groups:
          type: array
          items:
            $ref: "#/components/schemas/TopologyGroup"
          description: Optional grouping of nodes by resource type
        isDatabaseTopology:
          type: boolean
          description: >
            True if any node is a database_cluster or database_instance.
            Frontend uses this flag to switch to the layered database
            graph renderer.
    TopologyNode:
      type: object
      required:
        - id
        - resourceType
        - resourceSubtype
        - name
        - displayName
        - environmentId
        - ownerId
        - lifecycleStatus
        - healthStatus
        - isRoot
        - distance
        - topologyRole
        - topologyLayer
        - visualImportance
        - isDatabaseTopology
      properties:
        id:
          type: integer
          format: int64
        resourceType:
          $ref: "#/components/schemas/ResourceType"
        resourceSubtype:
          type: string
        name:
          type: string
        displayName:
          type: string
        environmentId:
          type: integer
          format: int64
        ownerId:
          type: integer
          format: int64
        lifecycleStatus:
          $ref: "#/components/schemas/LifecycleStatus"
        healthStatus:
          $ref: "#/components/schemas/HealthStatus"
        isRoot:
          type: boolean
          description: True if this node is the root resource
        distance:
          type: integer
          description: Hop distance from root (0 for root itself)
        topologyRole:
          $ref: "#/components/schemas/TopologyRole"
        topologyLayer:
          $ref: "#/components/schemas/TopologyLayer"
        groupKey:
          type: string
          description: >
            Grouping key for database instances. Format "cluster:{clusterId}".
            Set when the instance has a member_of relation to a database_cluster.
            Absent for non-instance nodes and instances without cluster membership.
        visualImportance:
          type: integer
          minimum: 1
          maximum: 10
          description: >
            Relative visual prominence (1-10). Root=10, primary=9, cluster=8,
            proxy_active=7, entry/service=6, replica_intermediate=5,
            replica/proxy_standby=4, control_plane=3, host=2, generic=1.
        isDatabaseTopology:
          type: boolean
          description: >
            True when any node in the topology is a database_cluster or
            database_instance. Mirrors the response-level flag for per-node
            convenience.
        replicationDepth:
          type: integer
          description: >
            Hop count from the replication primary (depth 0) along
            replicates_to edges. Only set for database_instance nodes
            that participate in a replication chain.
        replicationParentId:
          type: integer
          format: int64
          description: >
            ID of the upstream replication source. Only set for
            database_instance nodes that participate in a replication chain.
            Omitted for the primary (root of the chain).
    TopologyEdge:
      type: object
      required: [id, fromResourceId, toResourceId, relationType, semanticType]
      properties:
        id:
          type: integer
          format: int64
        fromResourceId:
          type: integer
          format: int64
        toResourceId:
          type: integer
          format: int64
        relationType:
          $ref: "#/components/schemas/RelationType"
        semanticType:
          $ref: "#/components/schemas/EdgeSemanticType"
    TopologyGroup:
      type: object
      required: [id, label, resourceType, nodeIds]
      properties:
        id:
          type: integer
          format: int64
          description: Numeric group identifier for a logical cluster or resource-type grouping
        label:
          type: string
          description: Human-readable group label
        resourceType:
          $ref: "#/components/schemas/ResourceType"
        nodeIds:
          type: array
          items:
            type: integer
            format: int64
          description: IDs of nodes belonging to this group
    TopologyRole:
      type: string
      enum:
        - application
        - entry
        - proxy_active
        - proxy_standby
        - cluster
        - primary
        - replica
        - replica_intermediate
        - host
        - control_plane
        - service
        - generic
      description: >
        Semantic role a node plays in the topology graph. Determined by
        resourceType, labels, and relation edges. Frontend uses this to
        pick icons, colors, and layout position.
    TopologyLayer:
      type: string
      enum:
        - application
        - entry
        - cluster
        - replication
        - control_plane
        - host
        - generic
      description: >
        Semantic band/layer for top-to-bottom layered graph layout.
        Mapped 1:1 from TopologyRole (service→application, entry/proxy→entry,
        cluster→cluster, primary/replica→replication, control_plane→control_plane,
        host→host).
    EdgeSemanticType:
      type: string
      enum:
        - traffic
        - failover
        - replication
        - membership
        - placement
        - management
        - dependency
        - monitoring
      description: >
        Semantic meaning of a topology edge. Used by frontend to choose
        line style, color, and arrow rendering. Determined by relation type
        and node properties (e.g., fronts from standby proxy → failover,
        manages from HA subtype → monitoring).
