  /resources/{id}/relations:
    get:
      summary: List relations for a resource
      description: >
        Returns relations involving the specified resource. By default, returns
        bare relation rows with from/to resource IDs. Use `?view=resolved` to
        include resolved metadata about the related resource (name, displayName,
        type, health, lifecycle status).
      operationId: listResourceRelations
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
            format: int64
        - in: query
          name: view
          schema:
            type: string
            enum: [resolved]
          description: >-
            Set to `resolved` to include related resource metadata. Omit for
            bare relation rows (backward compatible).
      responses:
        "200":
          description: Resource relation list
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      anyOf:
                        - $ref: "#/components/schemas/ResourceRelation"
                        - $ref: "#/components/schemas/ResourceRelationView"
        "400":
          description: Invalid resource ID
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    post:
      summary: Create a relation from this resource to another
      operationId: createResourceRelation
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RelationCreateInput"
            example:
              toResourceId: 2
              relationType: "depends_on"
      responses:
        "201":
          description: Relation created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResourceRelation"
        "400":
          description: Validation failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Source or target resource not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Duplicate relation already exists, or source/target resource is archived
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /resource-relations/{id}:
