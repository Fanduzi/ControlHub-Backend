openapi: 3.1.0
info:
  title: ControlHub API
  version: 0.1.0
  description: >
    **Security note (Phase 1):** Write endpoints (POST, PATCH, DELETE) do not
    enforce authentication or authorization. Any caller reaching the server can
    create, modify, or delete resources and relations. This is acceptable for
    local development only. An auth middleware gate must be added before any
    network-accessible deployment.
servers:
  - url: http://localhost:8080
paths:
  /auth/login:
    post:
      summary: Login with local credentials
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
            example:
              email: "admin@example.com"
              password: "secret123"
      responses:
        "200":
          description: Login response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        "400":
          description: Invalid request payload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /health:
    get:
      summary: Health check
      operationId: getHealth
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    type: string
                    enum:
                      - ok
  /query-targets:
    get:
      summary: List query targets for the Query Workbench
      operationId: listQueryTargets
      description: >-
        Read-only query target context derived from existing database instance
        resources. Returns the structured context a locked Query Workbench shell
        needs: connection context, query capability, readiness, governance, and
        locked available actions. Query execution is never enabled in Phase 36:
        every target reports executionEnabled=false and every available action is
        false. Readiness and query kind are derived and returned for the client to
        filter; only engine and environmentId are filtered server-side. Does not
        execute queries, store credentials, or introspect live databases.
      parameters:
        - in: query
          name: engine
          schema:
            type: string
          description: >-
            Filter by database engine (e.g. mysql, postgresql, clickhouse, redis,
            mongodb). Case-insensitive. Unknown engines still appear as
            unsupported targets when no filter is set.
        - in: query
          name: environmentId
          schema:
            type: integer
            format: int64
            minimum: 1
          description: Filter by environment ID
      responses:
        "200":
          description: Query target list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QueryTargetListResponse"
              example:
                items:
                  - resourceId: 22
                    resourceName: analytics-ch-node-01-prod
                    displayName: Analytics ClickHouse Node 01 Production
                    resourceType: database_instance
                    connectionContext:
                      environment: Production
                      owner: DBA Team
                      engine: clickhouse
                      host: prod-ch-host-01.internal
                      port: 8123
                      clusterId: 14
                      clusterName: Analytics ClickHouse Cluster Production
                    capability:
                      queryKind: sql
                      editorMode: sql
                      languageLabel: SQL
                    readiness: credential_required
                    missingFields:
                      - readonlyCredential
                    governance:
                      executionEnabled: false
                      credentialState: missing_readonly_credential
                      auditRequired: true
                      safetyState: credential_missing
                      safetyNote: Query execution is not enabled in this phase.
                      policyNotes:
                        - Read-only credentials are required before execution.
                        - Production queries require stricter defaults.
                    availableActions:
                      run: false
                      explain: false
                      export: false
                      saveSheet: false
                      requestAccess: false
                    schemaPreview: []
        "400":
          description: Invalid query parameters
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /query-targets/{id}/execute:
    post:
      summary: Execute a read-only SELECT against a query target
      operationId: executeQueryTarget
      description: >
        Phase 37 read-only sandbox. Runs a single guarded MySQL/TiDB SELECT under
        a backend-owned credential, bounded timeout, row cap, and payload caps.
        Requires a fresh Bearer token (bounded TTL). The actor is derived from the
        verified token and is never accepted in the request body. The resolved DSN
        is never returned.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
            minimum: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/QueryExecuteRequest"
            examples:
              acceptedSelect:
                value:
                  statement: "select 1 as value"
                  maxRows: 100
              rejectedUpdate:
                value:
                  statement: "update resources set name = 'x'"
                  maxRows: 100
      responses:
        "200":
          description: Execution result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QueryExecuteResponse"
              examples:
                success:
                  value:
                    executionId: 1001
                    status: success
                    targetResourceId: 22
                    engine: mysql
                    columns:
                      - {name: value, databaseType: BIGINT, nullable: false}
                    rows:
                      - [1]
                    rowCount: 1
                    truncated: false
                    durationMs: 18
                    limitApplied: 100
                    executedAt: "2026-06-22T08:30:00Z"
        "400":
          description: Validation failed (bad request, blocked statement, bad maxRows)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                blockedStatement:
                  value:
                    error: validation_failed
                    message: only a single SELECT statement is allowed
        "401":
          description: Missing or invalid Bearer token (or token older than the TTL)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Target not enabled or environment disallows execution
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Query target not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "408":
          description: Execution exceeded the timeout
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "502":
          description: Target database rejected or connection failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /query-targets/{id}/credential:
    get:
      summary: Get query credential metadata status for a query target
      operationId: getQueryTargetCredential
      description: >
        Phase 38A. Returns the credential metadata status for a MySQL/TiDB query
        target — metadata only (opaque credential ref, enabled flag, environment
        policy, runtime status). It NEVER returns a DSN, password, host, or port.
        Requires a fresh Bearer token.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
            minimum: 1
      responses:
        "200":
          description: Credential metadata status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QueryCredentialStatusResponse"
              examples:
                missing:
                  value:
                    resourceId: 22
                    configured: false
                    engine: mysql
                    credentialRef: ""
                    enabled: false
                    environmentPolicy: disabled
                    runtimeStatus: missing_metadata
                    executionEligible: false
                    message: "No read-only credential reference is configured."
                resolved:
                  value:
                    resourceId: 22
                    configured: true
                    engine: mysql
                    credentialRef: ORDER_MYSQL_RO
                    enabled: true
                    environmentPolicy: non_prod_only
                    runtimeStatus: secret_resolved
                    executionEligible: true
                    message: "Read-only credential is configured and bound to this target."
        "400":
          description: Invalid target id
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Missing or invalid Bearer token (or token older than the TTL)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Query target not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Unexpected server failure
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    put:
      summary: Create or update query credential metadata for a query target
      operationId: putQueryTargetCredential
      description: >
        Phase 38A. Admin-only. Persists credential METADATA for a MySQL/TiDB query
        target: an opaque credential reference, an enabled flag, and an environment
        policy. The body must never carry a DSN, password, host, port, or actor
        field (unknown fields are rejected by strict decoding). The engine is
        derived from the target, never accepted from the request. Save succeeds
        even when the secret cannot be resolved yet; the returned runtimeStatus
        explains it and the target stays locked. Requires a fresh Bearer token and
        the admin role.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
            minimum: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/QueryCredentialUpsertRequest"
            examples:
              nonProd:
                value:
                  credentialRef: ORDER_MYSQL_RO
                  enabled: true
                  environmentPolicy: non_prod_only
              allEnvironments:
                value:
                  credentialRef: ORDER_MYSQL_RO
                  enabled: true
                  environmentPolicy: all_environments
                  confirmAllEnvironments: true
      responses:
        "200":
          description: Updated credential metadata status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QueryCredentialStatusResponse"
        "400":
          description: Validation failed (invalid id, invalid ref/policy, unknown/secret/actor field, all-environments confirmation missing)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Missing or invalid Bearer token (or token older than the TTL)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Authenticated actor is not an admin
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Query target not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Persistence conflict
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Unexpected server failure
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      summary: Remove query credential metadata for a query target
      operationId: deleteQueryTargetCredential
      description: >
        Phase 38A. Admin-only. Removes a target's credential metadata and returns
        204. After delete the target remains visible and locked as
        credential_required. Requires a fresh Bearer token and the admin role.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
            minimum: 1
      responses:
        "204":
          description: Credential metadata removed
        "400":
          description: Invalid target id
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Missing or invalid Bearer token (or token older than the TTL)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Authenticated actor is not an admin
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Query target not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Unexpected server failure
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /query-targets/{id}/executions:
    get:
      summary: List execution history for a query target
      operationId: listQueryExecutions
      description: >
        Returns execution metadata (digest, status, row count, duration, errors)
        only — never full result rows. Requires a fresh Bearer token.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
            minimum: 1
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: pageSize
          in: query
          schema:
            type: integer
            minimum: 1
            default: 20
      responses:
        "200":
          description: Paginated execution history
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QueryExecutionListResponse"
              examples:
                history:
                  value:
                    items:
                      - id: 1001
                        targetResourceId: 22
                        actorUserId: 1
                        engine: mysql
                        statementDigest: "select id, name from resources where resource_type = ? limit ?"
                        statementPreview: "select id, name from resources where resource_type = 'service' limit 20"
                        status: success
                        rowCount: 1
                        durationMs: 18
                        errorCode: ""
                        errorMessage: ""
                        createdAt: "2026-06-22T08:30:00Z"
                    pageInfo:
                      page: 1
                      pageSize: 20
                      totalItems: 1
                      totalPages: 1
        "401":
          description: Missing or invalid Bearer token (or token older than the TTL)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /resources:
    get:
      summary: List resources
      operationId: listResources
      parameters:
        - in: query
          name: resourceType
          schema:
            type: array
            items:
              $ref: "#/components/schemas/ResourceType"
          style: form
          explode: true
          description: >-
            Filter by resource type (repeated for OR: ?resourceType=host&resourceType=database_instance).
            Across filter families = AND.
        - in: query
          name: environmentId
          schema:
            type: array
            items:
              type: integer
              format: int64
          style: form
          explode: true
          description: >-
            Filter by environment ID (repeated for OR). Across filter families = AND.
        - in: query
          name: lifecycleStatus
          schema:
            type: array
            items:
              $ref: "#/components/schemas/LifecycleStatus"
          style: form
          explode: true
          description: >-
            Filter by lifecycle status (repeated for OR). Across filter families = AND.
        - in: query
          name: healthStatus
          schema:
            type: array
            items:
              $ref: "#/components/schemas/HealthStatus"
          style: form
          explode: true
          description: >-
            Filter by health status (repeated for OR). Across filter families = AND.
        - in: query
          name: resourceSubtype
          schema:
            type: array
            items:
              type: string
          style: form
          explode: true
          description: >-
            Filter by resource subtype (repeated for OR: ?resourceSubtype=mysql&resourceSubtype=clickhouse).
            Across filter families = AND.
        - in: query
          name: q
          schema:
            type: string
          description: Free-text search over name, displayName, externalId
        - in: query
          name: page
          schema:
            type: integer
            default: 1
            minimum: 1
          description: Page number
        - in: query
          name: pageSize
          schema:
            type: integer
            default: 20
            minimum: 1
            maximum: 500
          description: Items per page
        - in: query
          name: includeArchived
          schema:
            type: boolean
            default: false
          description: Include archived resources in results (default excludes them)
        - in: query
          name: archivedOnly
          schema:
            type: boolean
            default: false
          description: >-
            Return only archived resources. Takes precedence over includeArchived
            when both are true.
      responses:
        "200":
          description: Resource list with pagination
          content:
            application/json:
              schema:
                type: object
                required: [items, pageInfo]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/Resource"
                  pageInfo:
                    $ref: "#/components/schemas/PageInfo"
              example:
                items:
                  - id: 4000000000000000001
                    resourceType: database_instance
                    resourceSubtype: mysql
                    name: order-mysql-prod
                    displayName: Order MySQL Prod
                    environmentId: 1000000000000000001
                    ownerId: 2000000000000000001
                    lifecycleStatus: running
                    healthStatus: healthy
                    source: manual
                    externalId: ext-order-mysql
                    labels:
                      team: order
                    createdAt: "2026-04-11T20:00:00Z"
                    updatedAt: "2026-04-11T20:00:00Z"
                pageInfo:
                  page: 1
                  pageSize: 20
                  totalItems: 64
                  totalPages: 4
        "400":
          description: Invalid query parameters
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    post:
      summary: Create a resource
      operationId: createResource
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResourceCreateInput"
            example:
              resourceType: "host"
              resourceSubtype: "vm"
              name: "fuzz-example-host"
              displayName: "Fuzz Example Host"
              environmentId: 1
              ownerId: 1
              lifecycleStatus: "running"
              healthStatus: "healthy"
              source: "manual"
      responses:
        "201":
          description: Resource created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Resource"
        "400":
          description: Validation failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Referenced environment or owner not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Resource name already exists in environment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /resources/{id}:
    get:
      summary: Get resource detail
      operationId: getResource
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: Resource detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResourceDetailResponse"
        "400":
          description: Invalid resource ID
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Resource not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    patch:
      summary: Update mutable resource fields
      operationId: patchResource
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
            format: int64
          example: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResourcePatchRequest"
            example:
              displayName: "Updated Resource"
      responses:
        "200":
          description: Resource updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Resource"
        "400":
          description: Validation failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Resource not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Resource is archived and cannot be modified
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /resources/{id}/archive:
    post:
      summary: Archive (soft-delete) a resource
      description: >
        Marks a resource as archived by setting archivedAt. Idempotent —
        archiving an already-archived resource returns it unchanged.
        Archived resources are excluded from default list queries but remain
        readable via GET detail. Archived resources reject PATCH and relation
        creation with 409.
      operationId: archiveResource
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ArchiveRequest"
      responses:
        "200":
          description: Resource archived (or already archived)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Resource"
        "400":
          description: Validation failed (e.g. blank reason)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Resource not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /resources/{id}/unarchive:
    post:
      summary: Restore an archived resource to active visibility
      description: >
        Clears archivedAt, archivedBy, and archiveReason on a resource.
        Idempotent — unarchiving an already-active resource returns it
        unchanged. After unarchiving, the resource reappears in default
        list queries and can be modified via PATCH again.
      operationId: unarchiveResource
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: Resource unarchived (or already active)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Resource"
        "400":
          description: Invalid resource ID
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Resource not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /resources/{id}/profile:
    get:
      summary: Get resource typed profile projection
      description: >
        Read-only projection of the typed profile row for a resource.
        The `profile` object keys vary by `resourceType` and
        `resourceSubtype`.  Values may be string, number, boolean, or null.
        If the resource exists but has no typed profile row, `profile` is
        returned as an empty object `{}`.
      operationId: getResourceProfile
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: Resource profile projection
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResourceProfileResponse"
        "400":
          description: Invalid resource ID
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Resource not found
    put:
      summary: Replace typed profile fields for a resource
      operationId: putResourceProfile
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        "204":
          description: Profile replaced
        "400":
          description: Validation failed or malformed JSON
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Resource not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Archived resource cannot be modified
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    patch:
      summary: Partially update typed profile fields for a resource
      operationId: patchResourceProfile
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        "204":
          description: Profile updated
        "400":
          description: Validation failed or malformed JSON
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Resource not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Archived resource cannot be modified
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      summary: Delete the typed profile row for a resource
      operationId: deleteResourceProfile
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "204":
          description: Profile deleted
        "400":
          description: Invalid resource ID
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Resource not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Archived resource cannot be modified
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /resources/{id}/members:
    get:
      summary: List cluster members
      description: >
        Returns resources that are members of the specified database cluster
        via `member_of` relations. Each member includes resolved metadata and
        an embedded profile summary. Returns an empty array for non-cluster
        resources or clusters with no members.
      operationId: getResourceMembers
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
            format: int64
          description: Cluster resource ID
      responses:
