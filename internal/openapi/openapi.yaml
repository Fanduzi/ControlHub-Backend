openapi: 3.1.0
info:
  title: ControlHub API
  version: 0.1.0
  description: >
    **Security note (Phase 1):** Write endpoints (POST, PATCH, DELETE) do not
    enforce authentication or authorization. Any caller reaching the server can
    create, modify, or delete resources and relations. This is acceptable for
    local development only. An auth middleware gate must be added before any
    network-accessible deployment.
servers:
  - url: http://localhost:8080
paths:
  /auth/login:
    post:
      summary: Login with local credentials
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Login response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
  /health:
    get:
      summary: Health check
      operationId: getHealth
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    type: string
                    const: ok
  /resources:
    get:
      summary: List resources
      operationId: listResources
      parameters:
        - in: query
          name: resourceType
          schema:
            $ref: "#/components/schemas/ResourceType"
          description: Filter by resource type
        - in: query
          name: environmentId
          schema:
            type: string
          description: Filter by environment ID
        - in: query
          name: lifecycleStatus
          schema:
            $ref: "#/components/schemas/LifecycleStatus"
          description: Filter by lifecycle status
        - in: query
          name: healthStatus
          schema:
            $ref: "#/components/schemas/HealthStatus"
          description: Filter by health status
        - in: query
          name: q
          schema:
            type: string
          description: Free-text search over name, displayName, externalId
        - in: query
          name: page
          schema:
            type: integer
            default: 1
            minimum: 1
          description: Page number
        - in: query
          name: pageSize
          schema:
            type: integer
            default: 20
            minimum: 1
            maximum: 100
          description: Items per page
      responses:
        "200":
          description: Resource list with pagination
          content:
            application/json:
              schema:
                type: object
                required: [items, pageInfo]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/Resource"
                  pageInfo:
                    $ref: "#/components/schemas/PageInfo"
              example:
                items:
                  - id: res-1
                    resourceType: database_instance
                    resourceSubtype: mysql
                    name: order-mysql-prod
                    displayName: Order MySQL Prod
                    environmentId: env-prod
                    ownerId: owner-dba
                    lifecycleStatus: running
                    healthStatus: healthy
                    source: manual
                    externalId: ext-order-mysql
                    labels:
                      team: order
                    createdAt: "2026-04-11T20:00:00Z"
                    updatedAt: "2026-04-11T20:00:00Z"
                pageInfo:
                  page: 1
                  pageSize: 20
                  totalItems: 64
                  totalPages: 4
    post:
      summary: Create a resource
      operationId: createResource
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResourceCreateInput"
      responses:
        "201":
          description: Resource created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Resource"
        "400":
          description: Validation failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Referenced environment or owner not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Resource name already exists in environment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /resources/{id}:
    get:
      summary: Get resource detail
      operationId: getResource
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Resource detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Resource"
    patch:
      summary: Update mutable resource fields
      operationId: patchResource
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResourcePatchRequest"
      responses:
        "200":
          description: Resource updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Resource"
        "400":
          description: Validation failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Resource not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /resources/{id}/profile:
    get:
      summary: Get resource typed profile projection
      description: >
        Read-only projection of the typed profile row for a resource.
        The `profile` object keys vary by `resourceType` and
        `resourceSubtype`.  Values may be string, number, boolean, or null.
        If the resource exists but has no typed profile row, `profile` is
        returned as an empty object `{}`.
      operationId: getResourceProfile
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Resource profile projection
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResourceProfileResponse"
        "404":
          description: Resource not found
  /resources/{id}/relations:
    get:
      summary: List relations for a resource
      operationId: listResourceRelations
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Resource relation list
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/ResourceRelation"
    post:
      summary: Create a relation from this resource to another
      operationId: createResourceRelation
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RelationCreateInput"
      responses:
        "201":
          description: Relation created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResourceRelation"
        "400":
          description: Validation failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Source or target resource not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Duplicate relation already exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /resource-relations/{id}:
    delete:
      summary: Delete a relation
      operationId: deleteResourceRelation
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Relation deleted
        "404":
          description: Relation not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    get:
      summary: List audit events for a resource
      description: >
        Phase-1 bootstrap endpoint. Backed by a minimal MySQL table for
        local development only; the long-term backing store will be
        ClickHouse.  The response shape will remain stable after migration.
      operationId: listResourceAuditEvents
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Resource audit list
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/AuditEvent"
  /audit-events:
    get:
      summary: List audit events
      description: >
        Phase-1 bootstrap endpoint. Backed by a minimal MySQL table for
        local development only; the long-term backing store will be
        ClickHouse.  The response shape will remain stable after migration.
      operationId: listAuditEvents
      parameters:
        - in: query
          name: targetResourceId
          schema:
            type: string
          description: Filter by target resource ID
        - in: query
          name: eventType
          schema:
            type: string
          description: Filter by event type (e.g. resource.created, resource.updated)
        - in: query
          name: result
          schema:
            type: string
          description: Filter by result (success, failure, partial)
        - in: query
          name: page
          schema:
            type: integer
            default: 1
            minimum: 1
          description: Page number
        - in: query
          name: pageSize
          schema:
            type: integer
            default: 20
            minimum: 1
            maximum: 100
          description: Items per page
      responses:
        "200":
          description: Audit event list with pagination
          content:
            application/json:
              schema:
                type: object
                required: [items, pageInfo]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/AuditEvent"
                  pageInfo:
                    $ref: "#/components/schemas/PageInfo"
              example:
                items:
                  - id: audit-1
                    actorUserId: user-1
                    targetResourceId: res-1
                    eventType: resource.updated
                    result: success
                    createdAt: "2026-04-11T21:00:00Z"
                pageInfo:
                  page: 1
                  pageSize: 20
                  totalItems: 25
                  totalPages: 2
  /environments:
    get:
      summary: List environments
      operationId: listEnvironments
      responses:
        "200":
          description: Environment list
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/Environment"
  /owners:
    get:
      summary: List owners
      operationId: listOwners
      responses:
        "200":
          description: Owner list
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/Owner"
  /roles:
    get:
      summary: List roles
      operationId: listRoles
      responses:
        "200":
          description: Role list
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/Role"
  /resource-types:
    get:
      summary: List resource types
      operationId: listResourceTypes
      responses:
        "200":
          description: Resource type dictionary
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/DictionaryItem"
  /relation-types:
    get:
      summary: List relation types
      operationId: listRelationTypes
      responses:
        "200":
          description: Relation type dictionary
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/DictionaryItem"
  /lifecycle-statuses:
    get:
      summary: List lifecycle statuses
      operationId: listLifecycleStatuses
      responses:
        "200":
          description: Lifecycle status dictionary
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/DictionaryItem"
  /health-statuses:
    get:
      summary: List health statuses
      operationId: listHealthStatuses
      responses:
        "200":
          description: Health status dictionary
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/DictionaryItem"
  # ──────────────────────────────────────────────────────────────
  # PROPOSED: Topology endpoint contract (not yet implemented)
  #
  # GET /resources/{id}/topology
  #
  # Returns a local topology projection around a resource.
  # Scope: 1-hop or 2-hop neighborhood, built from existing
  # resources + relations. Not a global graph.
  #
  # Proposed response shape:
  #   {
  #     "rootResourceId": "string",
  #     "nodes": [
  #       {
  #         "id": "string",
  #         "resourceType": "string",
  #         "name": "string",
  #         "displayName": "string",
  #         "lifecycleStatus": "string",
  #         "healthStatus": "string"
  #       }
  #     ],
  #     "edges": [
  #       {
  #         "id": "string",
  #         "fromResourceId": "string",
  #         "toResourceId": "string",
  #         "relationType": "string"
  #       }
  #     ],
  #     "groups": [
  #       {
  #         "id": "string",
  #         "label": "string",
  #         "nodeIds": ["string"]
  #       }
  #     ]
  #   }
  #
  # Design notes:
  # - nodes/edges are required; groups is optional
  # - groups provide layout hints (e.g., cluster membership)
  # - no layout engine; positioning is client-side
  # - no topology persistence; built on-the-fly from resources + relations
  # - rootResourceId identifies the center of the local graph
  # ──────────────────────────────────────────────────────────────
components:
  schemas:
    PageInfo:
      type: object
      required: [page, pageSize, totalItems, totalPages]
      properties:
        page:
          type: integer
          description: Current page number (1-based)
        pageSize:
          type: integer
          description: Number of items per page
        totalItems:
          type: integer
          description: Total number of items matching the query
        totalPages:
          type: integer
          description: Total number of pages
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
    LoginResponse:
      type: object
      required: [token, role]
      properties:
        token:
          type: string
        role:
          type: string
    ResourceType:
      type: string
      enum:
        - host
        - database_instance
        - database_cluster
        - service
        - domain_name
        - virtual_ip
        - database_proxy
        - control_plane_component
    RelationType:
      type: string
      enum:
        - depends_on
        - member_of
        - runs_on
        - points_to
        - fronts
        - manages
        - replicates_to
    LifecycleStatus:
      type: string
      enum:
        - provisioning
        - running
        - stopped
        - degraded
        - decommissioning
    HealthStatus:
      type: string
      enum:
        - healthy
        - warning
        - critical
        - unknown
    DictionaryItem:
      type: object
      required: [key, label, description]
      properties:
        key:
          type: string
        label:
          type: string
        description:
          type: string
    Resource:
      type: object
      required:
        - id
        - resourceType
        - resourceSubtype
        - name
        - displayName
        - environmentId
        - ownerId
        - lifecycleStatus
        - healthStatus
        - source
        - externalId
      properties:
        id:
          type: string
        resourceType:
          $ref: "#/components/schemas/ResourceType"
        resourceSubtype:
          type: string
        name:
          type: string
        displayName:
          type: string
        environmentId:
          type: string
        ownerId:
          type: string
        lifecycleStatus:
          $ref: "#/components/schemas/LifecycleStatus"
        healthStatus:
          $ref: "#/components/schemas/HealthStatus"
        source:
          type: string
        externalId:
          type: string
        labels:
          type: object
          additionalProperties:
            type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    ResourceRelation:
      type: object
      required: [id, fromResourceId, toResourceId, relationType, createdAt]
      properties:
        id:
          type: string
        fromResourceId:
          type: string
        toResourceId:
          type: string
        relationType:
          $ref: "#/components/schemas/RelationType"
        createdAt:
          type: string
          format: date-time
    AuditEvent:
      type: object
      required: [id, actorUserId, eventType, result, createdAt]
      properties:
        id:
          type: string
        actorUserId:
          type: string
        targetResourceId:
          type: string
        eventType:
          type: string
        result:
          type: string
        createdAt:
          type: string
          format: date-time
    Environment:
      type: object
      required: [id, name, slug, description, createdAt]
      properties:
        id:
          type: string
        name:
          type: string
        slug:
          type: string
        description:
          type: string
        createdAt:
          type: string
          format: date-time
    Owner:
      type: object
      required: [id, name, email, createdAt]
      properties:
        id:
          type: string
        name:
          type: string
        email:
          type: string
          format: email
        createdAt:
          type: string
          format: date-time
    Role:
      type: object
      required: [id, name, description, createdAt]
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string
        createdAt:
          type: string
          format: date-time
    ResourceProfileResponse:
      type: object
      required: [resourceId, resourceType, resourceSubtype, profile]
      properties:
        resourceId:
          type: string
        resourceType:
          $ref: "#/components/schemas/ResourceType"
        resourceSubtype:
          type: string
        profile:
          type: object
          additionalProperties: true
          description: >
            Typed profile fields.  Keys depend on resourceType:
            - database_instance: engine, version, host, port, role
            - database_cluster: engine, topologyMode, primaryEndpoint
            - service: systemName, repositoryUrl, runtimeEnv
            - host: hostname, ipAddress, osName
    ResourceCreateInput:
      type: object
      required:
        - resourceType
        - name
        - displayName
        - environmentId
        - ownerId
        - lifecycleStatus
        - healthStatus
        - source
      properties:
        resourceType:
          $ref: "#/components/schemas/ResourceType"
        resourceSubtype:
          type: string
        name:
          type: string
          pattern: "^[a-z0-9][a-z0-9._-]*$"
        displayName:
          type: string
        environmentId:
          type: string
        ownerId:
          type: string
        lifecycleStatus:
          $ref: "#/components/schemas/LifecycleStatus"
        healthStatus:
          $ref: "#/components/schemas/HealthStatus"
        source:
          type: string
          enum: [manual]
        externalId:
          type: string
        labels:
          type: object
          additionalProperties:
            type: string
    ResourcePatchRequest:
      type: object
      properties:
        resourceSubtype:
          type: string
        displayName:
          type: string
        environmentId:
          type: string
        ownerId:
          type: string
        lifecycleStatus:
          $ref: "#/components/schemas/LifecycleStatus"
        healthStatus:
          $ref: "#/components/schemas/HealthStatus"
        source:
          type: string
          enum: [manual]
        externalId:
          type: string
        labels:
          type: object
          additionalProperties:
            type: string
    RelationCreateInput:
      type: object
      required:
        - toResourceId
        - relationType
      properties:
        toResourceId:
          type: string
        relationType:
          $ref: "#/components/schemas/RelationType"
    ErrorResponse:
      type: object
      required: [error, message]
      properties:
        error:
          type: string
          description: Machine-readable error code
        message:
          type: string
          description: Human-readable error description
