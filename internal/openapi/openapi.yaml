      summary: Delete a relation
      operationId: deleteResourceRelation
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "204":
          description: Relation deleted
        "400":
          description: Invalid relation ID
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Relation not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
