openapi: 3.1.0
info:
  title: ControlHub API
  version: 0.1.0
  description: >
    **Security note (Phase 1):** Write endpoints (POST, PATCH, DELETE) do not
    enforce authentication or authorization. Any caller reaching the server can
    create, modify, or delete resources and relations. This is acceptable for
    local development only. An auth middleware gate must be added before any
    network-accessible deployment.
servers:
  - url: http://localhost:8080
paths:
  /auth/login:
    post:
      summary: Login with local credentials
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Login response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        "400":
          description: Invalid request payload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /health:
    get:
      summary: Health check
      operationId: getHealth
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    type: string
                    enum:
                      - ok
  /resources:
    get:
      summary: List resources
      operationId: listResources
      parameters:
        - in: query
          name: resourceType
          schema:
            $ref: "#/components/schemas/ResourceType"
          description: Filter by resource type
        - in: query
          name: environmentId
          schema:
            type: string
          description: Filter by environment ID
        - in: query
          name: lifecycleStatus
          schema:
            $ref: "#/components/schemas/LifecycleStatus"
          description: Filter by lifecycle status
        - in: query
          name: healthStatus
          schema:
            $ref: "#/components/schemas/HealthStatus"
          description: Filter by health status
        - in: query
          name: q
          schema:
            type: string
          description: Free-text search over name, displayName, externalId
        - in: query
          name: page
          schema:
            type: integer
            default: 1
            minimum: 1
          description: Page number
        - in: query
          name: pageSize
          schema:
            type: integer
            default: 20
            minimum: 1
            maximum: 100
          description: Items per page
        - in: query
          name: includeArchived
          schema:
            type: boolean
            default: false
          description: Include archived resources in results (default excludes them)
        - in: query
          name: archivedOnly
          schema:
            type: boolean
            default: false
          description: >-
            Return only archived resources. Takes precedence over includeArchived
            when both are true.
      responses:
        "200":
          description: Resource list with pagination
          content:
            application/json:
              schema:
                type: object
                required: [items, pageInfo]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/Resource"
                  pageInfo:
                    $ref: "#/components/schemas/PageInfo"
              example:
                items:
                  - id: res-1
                    resourceType: database_instance
                    resourceSubtype: mysql
                    name: order-mysql-prod
                    displayName: Order MySQL Prod
                    environmentId: env-prod
                    ownerId: owner-dba
                    lifecycleStatus: running
                    healthStatus: healthy
                    source: manual
                    externalId: ext-order-mysql
                    labels:
                      team: order
                    createdAt: "2026-04-11T20:00:00Z"
                    updatedAt: "2026-04-11T20:00:00Z"
                pageInfo:
                  page: 1
                  pageSize: 20
                  totalItems: 64
                  totalPages: 4
    post:
      summary: Create a resource
      operationId: createResource
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResourceCreateInput"
      responses:
        "201":
          description: Resource created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Resource"
        "400":
          description: Validation failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Referenced environment or owner not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Resource name already exists in environment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /resources/{id}:
    get:
      summary: Get resource detail
      operationId: getResource
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Resource detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Resource"
        "404":
          description: Resource not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    patch:
      summary: Update mutable resource fields
      operationId: patchResource
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResourcePatchRequest"
      responses:
        "200":
          description: Resource updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Resource"
        "400":
          description: Validation failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Resource not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Resource is archived and cannot be modified
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /resources/{id}/archive:
    post:
      summary: Archive (soft-delete) a resource
      description: >
        Marks a resource as archived by setting archivedAt. Idempotent —
        archiving an already-archived resource returns it unchanged.
        Archived resources are excluded from default list queries but remain
        readable via GET detail. Archived resources reject PATCH and relation
        creation with 409.
      operationId: archiveResource
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ArchiveRequest"
      responses:
        "200":
          description: Resource archived (or already archived)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Resource"
        "400":
          description: Validation failed (e.g. blank reason)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Resource not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /resources/{id}/unarchive:
    post:
      summary: Restore an archived resource to active visibility
      description: >
        Clears archivedAt, archivedBy, and archiveReason on a resource.
        Idempotent — unarchiving an already-active resource returns it
        unchanged. After unarchiving, the resource reappears in default
        list queries and can be modified via PATCH again.
      operationId: unarchiveResource
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Resource unarchived (or already active)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Resource"
        "404":
          description: Resource not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /resources/{id}/profile:
    get:
      summary: Get resource typed profile projection
      description: >
        Read-only projection of the typed profile row for a resource.
        The `profile` object keys vary by `resourceType` and
        `resourceSubtype`.  Values may be string, number, boolean, or null.
        If the resource exists but has no typed profile row, `profile` is
        returned as an empty object `{}`.
      operationId: getResourceProfile
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Resource profile projection
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResourceProfileResponse"
        "404":
          description: Resource not found
  /resources/{id}/relations:
    get:
      summary: List relations for a resource
      operationId: listResourceRelations
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Resource relation list
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/ResourceRelation"
    post:
      summary: Create a relation from this resource to another
      operationId: createResourceRelation
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RelationCreateInput"
      responses:
        "201":
          description: Relation created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResourceRelation"
        "400":
          description: Validation failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Source or target resource not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Duplicate relation already exists, or source/target resource is archived
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /resource-relations/{id}:
    delete:
      summary: Delete a relation
      operationId: deleteResourceRelation
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Relation deleted
        "404":
          description: Relation not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /resources/{id}/audit-events:
    get:
      summary: List audit events for a resource
      description: >
        Phase-1 bootstrap endpoint. Backed by a minimal MySQL table for
        local development only; the long-term backing store will be
        ClickHouse.  The response shape will remain stable after migration.
      operationId: listResourceAuditEvents
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Resource audit list
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/AuditEvent"
  /audit-events:
    get:
      summary: List audit events
      description: >
        Phase-1 bootstrap endpoint. Backed by a minimal MySQL table for
        local development only; the long-term backing store will be
        ClickHouse.  The response shape will remain stable after migration.
      operationId: listAuditEvents
      parameters:
        - in: query
          name: targetResourceId
          schema:
            type: string
          description: Filter by target resource ID
        - in: query
          name: eventType
          schema:
            type: string
          description: Filter by event type (e.g. resource.created, resource.updated)
        - in: query
          name: result
          schema:
            type: string
          description: Filter by result (success, failure, partial)
        - in: query
          name: page
          schema:
            type: integer
            default: 1
            minimum: 1
          description: Page number
        - in: query
          name: pageSize
          schema:
            type: integer
            default: 20
            minimum: 1
            maximum: 100
          description: Items per page
      responses:
        "200":
          description: Audit event list with pagination
          content:
            application/json:
              schema:
                type: object
                required: [items, pageInfo]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/AuditEvent"
                  pageInfo:
                    $ref: "#/components/schemas/PageInfo"
              example:
                items:
                  - id: audit-1
                    actorUserId: user-1
                    targetResourceId: res-1
                    eventType: resource.updated
                    result: success
                    createdAt: "2026-04-11T21:00:00Z"
                pageInfo:
                  page: 1
                  pageSize: 20
                  totalItems: 25
                  totalPages: 2
  /environments:
    get:
      summary: List environments
      operationId: listEnvironments
      responses:
        "200":
          description: Environment list
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/Environment"
  /owners:
    get:
      summary: List owners
      operationId: listOwners
      responses:
        "200":
          description: Owner list
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/Owner"
  /roles:
    get:
      summary: List roles
      operationId: listRoles
      responses:
        "200":
          description: Role list
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/Role"
  /resource-types:
    get:
      summary: List resource types
      operationId: listResourceTypes
      responses:
        "200":
          description: Resource type dictionary
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/DictionaryItem"
  /relation-types:
    get:
      summary: List relation types
      operationId: listRelationTypes
      responses:
        "200":
          description: Relation type dictionary
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/DictionaryItem"
  /lifecycle-statuses:
    get:
      summary: List lifecycle statuses
      operationId: listLifecycleStatuses
      responses:
        "200":
          description: Lifecycle status dictionary
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/DictionaryItem"
  /health-statuses:
    get:
      summary: List health statuses
      operationId: listHealthStatuses
      responses:
        "200":
          description: Health status dictionary
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/DictionaryItem"
  # ──────────────────────────────────────────────────────────────
  # IMPLEMENTED: Topology read model endpoint
  # ──────────────────────────────────────────────────────────────
  /resources/{id}/topology:
    get:
      summary: Get resource topology
      description: >
        Read-only topology projection around a root resource, built from
        existing resources and relations. Returns nodes, edges, and
        optional groups for graph visualization. Supports depth (1 or 2)
        and directional filtering (upstream, downstream, or both).
      operationId: getResourceTopology
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
          description: Root resource ID
        - in: query
          name: depth
          schema:
            type: integer
            enum: [1, 2]
            default: 1
          description: Traversal depth (1 = direct neighbors, 2 = two hops)
        - in: query
          name: direction
          schema:
            type: string
            enum: [both, upstream, downstream]
            default: both
          description: >
            Expansion direction relative to the root.
            `downstream`: edges where root is fromResourceId.
            `upstream`: edges where root is toResourceId.
            `both`: include both.
        - in: query
          name: relationType
          schema:
            $ref: "#/components/schemas/RelationType"
          description: Optional filter to include only edges of this relation type
      responses:
        "200":
          description: Topology projection
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TopologyResponse"
              example:
                rootResourceId: "40000000-0000-0000-0000-000000000001"
                depth: 1
                direction: both
                nodes:
                  - id: "40000000-0000-0000-0000-000000000001"
                    resourceType: database_cluster
                    resourceSubtype: mysql
                    name: order-mysql-cluster-prod
                    displayName: Order MySQL Cluster Prod
                    environmentId: "10000000-0000-0000-0000-000000000001"
                    ownerId: "20000000-0000-0000-0000-000000000002"
                    lifecycleStatus: running
                    healthStatus: healthy
                    isRoot: true
                    distance: 0
                  - id: "40000000-0000-0000-0000-000000000002"
                    resourceType: database_instance
                    resourceSubtype: mysql
                    name: order-mysql-1-prod
                    displayName: Order MySQL 1 Prod
                    environmentId: "10000000-0000-0000-0000-000000000001"
                    ownerId: "20000000-0000-0000-0000-000000000002"
                    lifecycleStatus: running
                    healthStatus: healthy
                    isRoot: false
                    distance: 1
                edges:
                  - id: "50000000-0000-0000-0000-000000000001"
                    fromResourceId: "40000000-0000-0000-0000-000000000002"
                    toResourceId: "40000000-0000-0000-0000-000000000001"
                    relationType: member_of
                groups:
                  - id: group-database_cluster
                    label: Database Cluster
                    resourceType: database_cluster
                    nodeIds:
                      - "40000000-0000-0000-0000-000000000001"
                  - id: group-database_instance
                    label: Database Instance
                    resourceType: database_instance
                    nodeIds:
                      - "40000000-0000-0000-0000-000000000002"
        "400":
          description: Invalid query parameters
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Root resource not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
components:
  schemas:
    PageInfo:
      type: object
      required: [page, pageSize, totalItems, totalPages]
      properties:
        page:
          type: integer
          description: Current page number (1-based)
        pageSize:
          type: integer
          description: Number of items per page
        totalItems:
          type: integer
          description: Total number of items matching the query
        totalPages:
          type: integer
          description: Total number of pages
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          minLength: 1
        password:
          type: string
          minLength: 1
    LoginResponse:
      type: object
      required: [token, role]
      properties:
        token:
          type: string
        role:
          type: string
    ResourceType:
      type: string
      enum:
        - host
        - database_instance
        - database_cluster
        - service
        - domain_name
        - virtual_ip
        - database_proxy
        - control_plane_component
    RelationType:
      type: string
      enum:
        - depends_on
        - member_of
        - runs_on
        - points_to
        - fronts
        - manages
        - replicates_to
    LifecycleStatus:
      type: string
      enum:
        - provisioning
        - running
        - stopped
        - degraded
        - decommissioning
    HealthStatus:
      type: string
      enum:
        - healthy
        - warning
        - critical
        - unknown
    DictionaryItem:
      type: object
      required: [key, label, description]
      properties:
        key:
          type: string
        label:
          type: string
        description:
          type: string
    Resource:
      type: object
      required:
        - id
        - resourceType
        - resourceSubtype
        - name
        - displayName
        - environmentId
        - ownerId
        - lifecycleStatus
        - healthStatus
        - source
        - externalId
      properties:
        id:
          type: string
        resourceType:
          $ref: "#/components/schemas/ResourceType"
        resourceSubtype:
          type: string
        name:
          type: string
        displayName:
          type: string
        environmentId:
          type: string
        ownerId:
          type: string
        lifecycleStatus:
          $ref: "#/components/schemas/LifecycleStatus"
        healthStatus:
          $ref: "#/components/schemas/HealthStatus"
        source:
          type: string
        externalId:
          type: string
        labels:
          type: object
          additionalProperties:
            type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        archivedAt:
          type: string
          format: date-time
          nullable: true
          description: Timestamp when the resource was archived (null if active)
        archivedBy:
          type: string
          nullable: true
          description: User or system that archived the resource
        archiveReason:
          type: string
          nullable: true
          description: Human-readable reason for archiving
    ResourceRelation:
      type: object
      required: [id, fromResourceId, toResourceId, relationType, createdAt]
      properties:
        id:
          type: string
        fromResourceId:
          type: string
        toResourceId:
          type: string
        relationType:
          $ref: "#/components/schemas/RelationType"
        createdAt:
          type: string
          format: date-time
    AuditEvent:
      type: object
      required: [id, actorUserId, eventType, result, createdAt]
      properties:
        id:
          type: string
        actorUserId:
          type: string
        targetResourceId:
          type: string
        eventType:
          type: string
        result:
          type: string
        createdAt:
          type: string
          format: date-time
    Environment:
      type: object
      required: [id, name, slug, description, createdAt]
      properties:
        id:
          type: string
        name:
          type: string
        slug:
          type: string
        description:
          type: string
        createdAt:
          type: string
          format: date-time
    Owner:
      type: object
      required: [id, name, email, createdAt]
      properties:
        id:
          type: string
        name:
          type: string
        email:
          type: string
          format: email
        createdAt:
          type: string
          format: date-time
    Role:
      type: object
      required: [id, name, description, createdAt]
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string
        createdAt:
          type: string
          format: date-time
    ResourceProfileResponse:
      type: object
      required: [resourceId, resourceType, resourceSubtype, profile]
      properties:
        resourceId:
          type: string
        resourceType:
          $ref: "#/components/schemas/ResourceType"
        resourceSubtype:
          type: string
        profile:
          type: object
          additionalProperties: true
          description: >
            Typed profile fields.  Keys depend on resourceType:
            - database_instance: engine, version, host, port, role
            - database_cluster: engine, topologyMode, primaryEndpoint
            - service: systemName, repositoryUrl, runtimeEnv
            - host: hostname, ipAddress, osName
    ResourceCreateInput:
      type: object
      required:
        - resourceType
        - name
        - displayName
        - environmentId
        - ownerId
        - lifecycleStatus
        - healthStatus
        - source
      properties:
        resourceType:
          $ref: "#/components/schemas/ResourceType"
        resourceSubtype:
          type: string
        name:
          type: string
          minLength: 1
          pattern: "^[a-z0-9][a-z0-9._-]*$"
        displayName:
          type: string
          minLength: 1
        environmentId:
          type: string
          minLength: 1
        ownerId:
          type: string
          minLength: 1
        lifecycleStatus:
          $ref: "#/components/schemas/LifecycleStatus"
        healthStatus:
          $ref: "#/components/schemas/HealthStatus"
        source:
          type: string
          enum: [manual]
        externalId:
          type: string
        labels:
          type: object
          additionalProperties:
            type: string
    ResourcePatchRequest:
      type: object
      properties:
        resourceSubtype:
          type: string
        displayName:
          type: string
          minLength: 1
        environmentId:
          type: string
          minLength: 1
        ownerId:
          type: string
          minLength: 1
        lifecycleStatus:
          $ref: "#/components/schemas/LifecycleStatus"
        healthStatus:
          $ref: "#/components/schemas/HealthStatus"
        source:
          type: string
          enum: [manual]
        externalId:
          type: string
        labels:
          type: object
          additionalProperties:
            type: string
    RelationCreateInput:
      type: object
      required:
        - toResourceId
        - relationType
      properties:
        toResourceId:
          type: string
          minLength: 1
        relationType:
          $ref: "#/components/schemas/RelationType"
    ArchiveRequest:
      type: object
      properties:
        reason:
          type: string
          maxLength: 512
          description: Optional human-readable reason for archiving. If provided, must be non-blank.
    ErrorResponse:
      type: object
      required: [error, message]
      properties:
        error:
          type: string
          description: Machine-readable error code
        message:
          type: string
          description: Human-readable error description
    TopologyResponse:
      type: object
      required: [rootResourceId, depth, direction, nodes, edges, groups]
      properties:
        rootResourceId:
          type: string
          description: ID of the root resource the topology is centered on
        depth:
          type: integer
          description: Traversal depth used for this response (1 or 2)
        direction:
          type: string
          enum: [both, upstream, downstream]
          description: Direction filter used for this response
        nodes:
          type: array
          items:
            $ref: "#/components/schemas/TopologyNode"
          description: >
            De-duplicated nodes sorted by distance, then resource type,
            then name, then id. Root node is always first.
        edges:
          type: array
          items:
            $ref: "#/components/schemas/TopologyEdge"
          description: >
            De-duplicated edges sorted by relation type, fromResourceId,
            toResourceId, then id.
        groups:
          type: array
          items:
            $ref: "#/components/schemas/TopologyGroup"
          description: Optional grouping of nodes by resource type
    TopologyNode:
      type: object
      required:
        - id
        - resourceType
        - resourceSubtype
        - name
        - displayName
        - environmentId
        - ownerId
        - lifecycleStatus
        - healthStatus
        - isRoot
        - distance
      properties:
        id:
          type: string
        resourceType:
          $ref: "#/components/schemas/ResourceType"
        resourceSubtype:
          type: string
        name:
          type: string
        displayName:
          type: string
        environmentId:
          type: string
        ownerId:
          type: string
        lifecycleStatus:
          $ref: "#/components/schemas/LifecycleStatus"
        healthStatus:
          $ref: "#/components/schemas/HealthStatus"
        isRoot:
          type: boolean
          description: True if this node is the root resource
        distance:
          type: integer
          description: Hop distance from root (0 for root itself)
    TopologyEdge:
      type: object
      required: [id, fromResourceId, toResourceId, relationType]
      properties:
        id:
          type: string
        fromResourceId:
          type: string
        toResourceId:
          type: string
        relationType:
          $ref: "#/components/schemas/RelationType"
    TopologyGroup:
      type: object
      required: [id, label, resourceType, nodeIds]
      properties:
        id:
          type: string
          description: Group identifier (e.g., "group-database_cluster")
        label:
          type: string
          description: Human-readable group label
        resourceType:
          $ref: "#/components/schemas/ResourceType"
        nodeIds:
          type: array
          items:
            type: string
          description: IDs of nodes belonging to this group
