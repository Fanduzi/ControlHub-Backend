name: Backend CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      run_docker_gates:
        description: "Run Docker-backed integration and OpenAPI fuzz gates"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

permissions:
  contents: read

jobs:
  release-local-gates:
    name: release-local-gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Run backend local release gates
        run: make release-local-gates
      - name: Run Argon2id verification-budget gate
        run: make argon2id-budget
      - name: Upload Argon2id budget evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: argon2id-budget-evidence
          path: .argon2id-budget/
          retention-days: 7

  release-docker-gates:
    name: release-docker-gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Install Schemathesis
        run: python -m pip install --upgrade "schemathesis==4.15.2"
      - name: Run backend Docker release gates
        run: make release-docker-gates
      - name: Upload Schemathesis reports
        if: always() && hashFiles('.schemathesis-reports/**') != ''
        uses: actions/upload-artifact@v4
        with:
          name: schemathesis-reports
          path: .schemathesis-reports/
          retention-days: 7
